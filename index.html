<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Inglés y francés con lecturas propias, repaso espaciado y práctica para hablar.">
<meta name="theme-color" content="#E8E9E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B21" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voz Propia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
body{margin:0}
[hidden]{display:none!important}
html.vp-locked,html.vp-locked body{overflow:hidden}
#vp-auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.vp-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.vp-logo .brand{width:64px;height:64px}
.vp-f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}
.vp-f input{font:inherit;font-weight:400;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
.vp-msg{min-height:1.2em;font-size:.92rem;color:var(--muted)}
.vp-msg.bad{color:var(--bad)}
.vp-links{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
</style>
<title>Voz Propia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,500&display=swap">
<style>
/* Paleta de Valparaíso: neblina del puerto, azul de cerro, rojo de ascensor oxidado
   y las fachadas de calamina (mostaza, verde mar, lila, celeste) como acentos. */
:root{
  --bg:#E8E9E5; --surface:#F6F6F2; --sunk:#DFE1DC; --ink:#1F2933; --muted:#5B6570; --line:#D0D3CD;
  --en:#2D5876; --fr:#963E34; --good:#3F6E57; --bad:#A4442F; --warn:#9A6B12; --on-accent:#FFFFFF;
  --c1:#2D5876; --c2:#C4943A; --c3:#963E34; --c4:#5E8A74; --c5:#8B7AA0; --c6:#7FA3BA; --c7:#C98468;
  --chart-en:#2A6496; --chart-fr:#A8432F; --grid:#DCDFD9;
  --ui:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --rs:1.18rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151B21; --surface:#1D252D; --sunk:#121820; --ink:#E7E5DF; --muted:#9AA3AB; --line:#2E3842;
    --en:#86AECB; --fr:#D98A7C; --good:#86BFA2; --bad:#E48C76; --warn:#D9B260; --on-accent:#12171C;
    --c1:#5F8AA8; --c2:#C9A052; --c3:#B8625A; --c4:#6F9A84; --c5:#9C8CB0; --c6:#8DB0C4; --c7:#C98F76;
    --chart-en:#4C8CC2; --chart-fr:#D06A55; --grid:#2A343D;
  }
}
:root[data-theme="dark"]{
  --bg:#151B21; --surface:#1D252D; --sunk:#121820; --ink:#E7E5DF; --muted:#9AA3AB; --line:#2E3842;
  --en:#86AECB; --fr:#D98A7C; --good:#86BFA2; --bad:#E48C76; --warn:#D9B260; --on-accent:#12171C;
  --c1:#5F8AA8; --c2:#C9A052; --c3:#B8625A; --c4:#6F9A84; --c5:#9C8CB0; --c6:#8DB0C4; --c7:#C98F76;
  --chart-en:#4C8CC2; --chart-fr:#D06A55; --grid:#2A343D;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;--accent:var(--en);-webkit-text-size-adjust:100%}
body[data-lang="fr"]{--accent:var(--fr)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
p{margin:0}
h1{font-family:var(--read);font-size:1.6rem;line-height:1.2;letter-spacing:-.01em;font-weight:600;margin:0;text-wrap:balance}
h2{font-family:var(--read);font-size:1.25rem;line-height:1.25;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Estructura */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{width:40px;height:40px;flex:none;display:block}
.cerro{display:flex;align-items:flex-end;height:6px;gap:2px;max-width:760px;margin:0 auto;padding-inline:16px}
.cerro span{flex:1;border-radius:1px 1px 0 0}
.cerro span:nth-child(7n+1){background:var(--c1);height:100%}.cerro span:nth-child(7n+2){background:var(--c2);height:60%}
.cerro span:nth-child(7n+3){background:var(--c3);height:85%}.cerro span:nth-child(7n+4){background:var(--c4);height:50%}
.cerro span:nth-child(7n+5){background:var(--c5);height:75%}.cerro span:nth-child(7n+6){background:var(--c6);height:40%}
.cerro span:nth-child(7n){background:var(--c7);height:90%}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);min-height:56px;position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.66rem;line-height:17px;font-variant-numeric:tabular-nums}

/* Piezas comunes */
.lead{color:var(--muted);max-width:62ch}
.hint{font-size:.88rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.soft{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:12px 18px;min-height:48px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{min-height:40px;padding:8px 14px;font-size:.92rem}
.btn.wide{width:100%}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:700;min-height:38px;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;max-width:100%}
.seg button{padding:6px 13px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);min-height:36px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.muted{color:var(--muted);border-color:var(--line)}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
textarea,input[type=text],input[type=search],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{width:100%;accent-color:var(--accent)}
.thinking{color:var(--muted);display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:9;max-width:90vw;text-align:center}
.say{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:.8rem;display:grid;place-items:center}
.say.on,.play.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.why{border-radius:10px;padding:12px 14px;font-size:.95rem;line-height:1.5}
.note{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.menu>button,.menu>.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);min-height:62px;width:100%}
.menu>:last-child{border-bottom:0}
.menu b{display:block;font-weight:700}
.menu small{color:var(--muted);font-size:.84rem;display:block;line-height:1.35}
.menu .go{color:var(--accent);font-weight:700;font-size:1.15rem;flex:none}
.del{flex:none;width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:1.2rem}
.confirm{display:flex;gap:8px;align-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.stat b{font-size:1.5rem;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:.76rem;color:var(--muted);display:block;line-height:1.3}
.meter{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(70px,1fr) 46px;gap:10px;align-items:center;font-size:.9rem}
.meter .prog{height:8px}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.mlist{display:flex;flex-direction:column;margin-inline:-8px}
.mbtn{text-align:left;padding:10px 8px;border-radius:8px;min-height:44px;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 62px}
.mbtn:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mbtn span:last-child::after{content:" →";color:var(--accent)}
.back{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Hoy */
.hoy-head{display:flex;justify-content:space-between;align-items:center;gap:14px}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:700}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .rv b{font-size:1.45rem;display:block}
.ring .rv span{font-size:.7rem;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;min-height:68px}
.step .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.step.done{opacity:.78}
.step b{display:block;font-weight:700;line-height:1.3}
.step small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.step .min{font-size:.78rem;color:var(--muted);font-weight:700;white-space:nowrap}
.step.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* Gráfico semanal */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--ui)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit:focus{fill:color-mix(in srgb,var(--ink) 6%,transparent);outline:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:.8rem;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip b{font-size:.95rem}
.tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
details.table summary{font-size:.84rem;color:var(--muted);cursor:pointer;font-weight:700}
details.table table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px;font-variant-numeric:tabular-nums}
details.table td,details.table th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
details.table th:first-child,details.table td:first-child{text-align:left}

/* Lectura */
.durs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dur{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 6px;text-align:center}
.dur b{display:block;font-family:var(--read);font-size:1.6rem;font-weight:600;line-height:1}
.dur span{font-size:.74rem;color:var(--muted)}
.dur[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
.dur[aria-pressed="true"] b{color:var(--accent)}
.reader{display:flex;flex-direction:column;gap:14px}
.rt{font-family:var(--read);font-size:1.55rem;line-height:1.2;font-weight:600;text-wrap:balance}
.para{display:flex;flex-direction:column;gap:6px;border-radius:10px;margin-inline:-8px;padding:4px 8px;transition:background .2s}
.para.playing{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rp{font-family:var(--read);font-size:var(--rs);line-height:1.75;max-width:65ch;display:flex;gap:8px;align-items:flex-start}
.rp>span:first-child{flex:1;min-width:0}
.rp strong{font-weight:600;color:var(--accent)}
.pbtns{display:flex;flex-direction:column;gap:6px;flex:none;margin-top:4px}
.esb{height:36px;min-width:36px;padding:0 8px;border-radius:18px;border:1px solid var(--line);color:var(--muted);font-size:.74rem;font-weight:700}
.esb.on{border-color:var(--accent);color:var(--accent)}
.tr{font-size:.98rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;max-width:65ch;margin-left:2px;border-radius:0}
.w{cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
.w.gl{text-decoration:underline dotted color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:4px;text-decoration-thickness:1.5px}
.w.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.notes{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.notes li{max-width:65ch}
.notes strong{color:var(--accent)}
details.sayit{border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface)}
details.sayit summary{padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sayit summary::-webkit-details-marker{display:none}
details.sayit summary::after{content:"Así se dice";flex:none;font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:3px 9px;align-self:center}
details.sayit[open] summary::after{content:"Ocultar"}
details.sayit .said{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
details.sayit .said .t{font-family:var(--read);font-size:1.12rem}
.vocab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 36px;gap:6px 12px;font-size:.95rem;align-items:center}
.vocab b{font-family:var(--read);font-weight:600;color:var(--accent)}
.vocab span{color:var(--muted)}
.vocab .plus{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--accent);font-weight:700}
.vocab .plus[disabled]{color:var(--good);border-color:var(--good)}
.quiz-q{display:flex;flex-direction:column;gap:8px}
.quiz-q p{font-weight:700}
.qopt{text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);min-height:46px}
.qopt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.qopt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.bar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(20,30,40,.14);z-index:4}
.bar .btn{flex:1;padding:8px 10px;min-height:44px}
.ib{min-width:44px;height:44px;border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:.85rem;display:grid;place-items:center;padding:0 8px}
.ib.on{border-color:var(--accent);color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);padding:0 4px;font-size:.85rem}

/* Hoja de significado */
.sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:8;padding-inline:12px}
.sheet-in{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 -6px 28px rgba(20,30,40,.2);padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.sheet .term{font-family:var(--read);font-size:1.35rem;font-weight:600;color:var(--accent)}
.sheet .pron{color:var(--muted);font-size:.9rem}
.sheet .x{flex:none;font-size:1.4rem;line-height:1;color:var(--muted);width:40px;height:40px;border:1px solid var(--line);border-radius:50%}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* Práctica, repaso y tarjetas */
.q{font-family:var(--read);font-size:1.3rem;line-height:1.5}
.q u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 14px;color:var(--accent);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 10px;font-weight:700;background:var(--surface);min-height:52px}
.opt.ok{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.ko{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.ans{font-size:1.15rem;font-family:var(--read);letter-spacing:.01em}
.ans.ok{border-color:var(--good)} .ans.ko{border-color:var(--bad)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{min-width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-family:var(--read)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .t{font-family:var(--read);font-size:1.2rem;line-height:1.5}
.card .t strong{color:var(--accent);font-weight:600}
.card .es{color:var(--muted)}
.big{font-family:var(--read);font-size:3.6rem;font-weight:600;line-height:1;text-align:center;color:var(--accent);letter-spacing:-.02em}
.flash{min-height:230px;justify-content:center;text-align:center;align-items:center;gap:14px}
.flash .front{font-family:var(--read);font-size:1.6rem;line-height:1.35;text-wrap:balance}
.flash .ctx{font-family:var(--read);color:var(--muted);font-size:1.02rem;max-width:52ch}
.flash .ctx b{color:var(--ink);font-weight:600}
.flash .backside{display:flex;flex-direction:column;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:12px;width:100%}
.flash .meaning{font-size:1.15rem;font-weight:700}
.kind{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;min-height:58px;background:var(--surface);font-weight:700;font-size:.9rem;line-height:1.2}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.grades .g0{border-color:var(--bad);color:var(--bad)} .grades .g2{border-color:var(--good);color:var(--good)}
.conj{width:100%;border-collapse:collapse;font-family:var(--read);font-size:1.05rem}
.conj td{padding:6px 4px;border-bottom:1px solid var(--line)}
.conj td:last-child{width:40px;text-align:right}
.conj tr.hl td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.conj .sj{color:var(--muted)}
.verbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.verbs button{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;background:var(--surface);min-height:52px;line-height:1.25}
.verbs button b{display:block;font-family:var(--read);font-weight:600}
.verbs button small{color:var(--muted);font-size:.78rem}
.verbs button.seen{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* Hablar */
.prompt-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prompt-card .p{font-family:var(--read);font-size:1.3rem;line-height:1.4;text-wrap:balance}
.clock{font-size:3.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.diff{font-family:var(--read);font-size:1.12rem;line-height:1.7}
.diff del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:3px;padding:0 2px}
.diff ins{color:var(--good);text-decoration:none;background:color-mix(in srgb,var(--good) 14%,transparent);border-radius:3px;padding:0 2px;font-weight:600}
.fix{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.fix:last-child{border-bottom:0}
.fix .ft{font-family:var(--read)}
.fix .ft s{color:var(--bad)} .fix .ft b{color:var(--good);font-weight:600}
.dictate{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted)}
.dictate svg{flex:none;width:18px;height:18px;margin-top:2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* Guía */
details.tipx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
details.tipx summary{padding:13px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.tipx summary::-webkit-details-marker{display:none}
details.tipx summary::after{content:"+";color:var(--accent);font-weight:700}
details.tipx[open] summary::after{content:"–"}
details.tipx .body{padding:0 0 14px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.ex{font-family:var(--read);border-left:3px solid var(--accent);padding-left:10px;border-radius:0}
.answer{white-space:pre-wrap;font-size:.97rem;max-width:65ch}
.setrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.para{transition:none}}
@media (min-width:700px){.opts{grid-template-columns:repeat(4,1fr)}}

<script>
/* ===================== App instalable: conecta Voz Propia con su servidor (Supabase) =====================
   App personal, sin cuentas: cada dispositivo guarda una llave de acceso la primera vez que se abre con el
   enlace personal (…/#k=LLAVE). Ofrece a la app la misma interfaz que el entorno de Claude:
   - db: documentos por ruta ("items/abc", "state/progress") a través de la función "vp".
   - sample: Claude a través de la misma función (la clave de Anthropic nunca llega al navegador).
   - downloads: guarda archivos con una descarga normal del navegador. */
(function () {
  const CFG = window.VP_CONFIG;
  const FN = CFG.url + "/functions/v1/vp";
  const KEY = "vp-access";
  const cp = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const getKey = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };
  const setKey = k => { try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch {} };
  const keyFrom = s => { s = String(s).trim(); return (s.match(/k=([A-Za-z0-9_-]{32,200})/) || s.match(/^([A-Za-z0-9_-]{32,200})$/) || [])[1] || ""; };

  // El enlace personal trae la llave después de "#k=": se guarda en este dispositivo y se borra de la barra de direcciones
  const fromUrl = location.hash.match(/[#&]k=([A-Za-z0-9_-]{32,200})/);
  if (fromUrl) { setKey(fromUrl[1]); history.replaceState(null, "", location.pathname + location.search); }

  // Mensajes propios de esta versión (la app los mezcla con los suyos)
  window.VP_HOST = {
    errors: {
      not_granted: "Este dispositivo no tiene acceso. Ábrelo con tu enlace personal.",
      not_configured: "Falta configurar la clave de Anthropic en Supabase.",
      offline: "Sin conexión. Lo guardado y las prácticas siguen funcionando; para crear algo nuevo necesitas internet.",
      prompt_too_large: "El texto es demasiado largo para enviarlo.",
    },
  };

  /* ---------- Acceso ---------- */
  let ready, box = null;
  const granted = new Promise(r => (ready = r));
  // Con la llave guardada se entra de inmediato, aunque no haya conexión (lo local sigue funcionando)
  if (getKey()) { ready(); check(); } else showGate();
  // Si la llave dejó de ser válida, se vuelve a pedir
  async function check() {
    if (!navigator.onLine) return;
    try { await call("ping"); } catch (e) { if (e.code === "not_granted") { setKey(""); showGate("Esta llave ya no es válida. Abre tu enlace personal nuevo."); } }
  }

  async function call(op, payload = {}, signal) {
    if (!navigator.onLine) throw { code: "offline", text: "" };
    let res;
    try {
      res = await fetch(FN, { method: "POST", signal, body: JSON.stringify({ op, ...payload }),
        headers: { "content-type": "application/json", apikey: CFG.key, "x-vp-key": getKey() } });
    } catch { throw { code: signal?.aborted ? "cancelled" : "offline", text: "" }; }
    if (!res.ok) {
      let j = {}; try { j = await res.json(); } catch {}
      throw { code: j.error?.code || "upstream_error", message: j.error?.message, text: "" };
    }
    return res;
  }
  const callJson = async (op, payload) => (await call(op, payload)).json();

  /* ---------- db ---------- */
  const snap = (path, data) => ({ id: path.split("/").pop(), exists: data != null, data: () => cp(data ?? undefined), metadata: {} });
  function docRef(path) {
    const ref = {
      id: path.split("/").pop(), path,
      async get() { const { data } = await callJson("get", { path }); return snap(path, data); },
      async set(v) { await callJson("set", { path, data: cp(v) }); },
      async update(v) { const cur = await ref.get(); if (!cur.exists) throw { code: "invalid_argument" }; await ref.set({ ...cur.data(), ...v }); },
      async delete() { await callJson("delete", { path }); },
      collection: p => colRef(path + "/" + p),
    };
    return ref;
  }
  function colRef(path, o = {}) {
    return {
      path,
      doc: id => docRef(path + "/" + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
      orderBy: (f, dir = "asc") => colRef(path, { ...o, f, dir }),
      limit: n => colRef(path, { ...o, n }),
      async get() {
        const { docs: rows } = await callJson("list", { prefix: path, order: o.f, dir: o.dir, limit: o.n });
        const docs = rows.map(r => snap(r.path, r.data));
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} };
      },
      async add(v) { const r = this.doc(); await r.set(v); return r; },
    };
  }
  const db = { doc: docRef, collection: p => colRef(p) };

  /* ---------- sample (Claude) ---------- */
  async function sample(input, o = {}) {
    const tier = o.modelTier || "default";
    const res = await call("claude", typeof input === "string" ? { prompt: input, tier } : { messages: input, tier }, o.signal);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", text = "", end = null;
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.t) { text += ev.t; o.onText?.({ text, delta: ev.t }); }
          else if (ev.error) throw { code: ev.error.code, message: ev.error.message, text };
          else if (ev.done) end = ev;
        }
      }
    } catch (e) {
      if (o.signal?.aborted) throw { code: "cancelled", text };
      if (e?.code) throw e;
      throw { code: "offline", text };
    }
    if (!end) throw { code: "upstream_error", text };
    return { text, truncated: !!end.truncated, modelTierApplied: tier };
  }
  const JSON_RULE = "\n\nReply with only valid JSON: no code fences and no text before or after it.";
  function parseJson(s) {
    s = String(s).trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    try { return JSON.parse(s); } catch {}
    const a = s.search(/[[{]/), b = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (a >= 0 && b > a) try { return JSON.parse(s.slice(a, b + 1)); } catch {}
    return undefined;
  }
  sample.json = async (input, o = {}) => {
    const inp = typeof input === "string" ? input + JSON_RULE
      : input.map((m, i, a) => i === a.length - 1 ? { ...m, content: m.content + JSON_RULE } : m);
    const { text } = await sample(inp, { modelTier: o.modelTier, signal: o.signal });
    const v = parseJson(text);
    if (v === undefined) throw { code: "invalid_json" };
    return v;
  };
  sample.limits = async () => ({ maxPromptBytes: 120000 });

  /* ---------- downloads ---------- */
  const downloads = {
    async save({ filename, data, mimeType }) {
      const type = mimeType || (/\.html?$/i.test(filename) ? "text/html;charset=utf-8" : "application/octet-stream");
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
      const a = Object.assign(document.createElement("a"), { href: url, download: filename });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return { status: "saved" };
    },
  };

  window.claude = { use: async name => { await granted; return { db, sample, downloads }[name] || null; } };

  /* ---------- Instalar ---------- */
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
  addEventListener("appinstalled", () => { installEvt = null; });
  const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  /* ---------- Dispositivo en Ajustes ---------- */
  window.vpAccount = {
    row: () => `<div class="setrow"><h3>Este dispositivo</h3><p class="hint">Conectado con tu llave personal. Tus datos se sincronizan entre el celular y la tablet.</p>
      <div class="chips">${!standalone() && installEvt ? `<button class="btn small" data-vp="install">Instalar app</button>` : ""}<button class="btn quiet small" data-vp="logout">Desconectar este dispositivo</button></div>
      ${!standalone() && !installEvt ? `<p class="hint">Para instalarla: en Android, Chrome → menú ⋮ → «Instalar app»; en iPhone, Safari → Compartir → «Agregar a inicio»; en el computador, el ícono de instalar en la barra de direcciones.</p>` : ""}</div>`,
  };
  document.addEventListener("click", async e => {
    const b = e.target.closest?.("[data-vp]");
    if (!b) return;
    if (b.dataset.vp === "install" && installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; b.remove(); }
    if (b.dataset.vp === "logout") {
      if (!confirm("¿Desconectar este dispositivo? Tus datos quedan guardados en el servidor; para volver a entrar necesitas tu enlace personal.")) return;
      setKey("");
      // Se borra la copia local de este dispositivo (salvo voces y velocidad, que son del dispositivo)
      try { Object.keys(localStorage).filter(k => k.startsWith("vp:") && !k.startsWith("vp:voice:")).forEach(k => localStorage.removeItem(k)); } catch {}
      location.replace(location.pathname);
    }
  });

  /* ---------- Pantalla de acceso (solo si este dispositivo aún no tiene la llave) ---------- */
  function showGate(note) {
    if (!box) {
      box = document.createElement("div");
      box.id = "vp-auth";
      box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "vp-auth-t");
      box.innerHTML = `<form class="vp-card" novalidate>
        <div class="vp-logo" aria-hidden="true"></div>
        <h1 id="vp-auth-t">Voz Propia</h1>
        <p class="hint">Esta es una app personal. Para conectar este dispositivo, abre tu enlace personal o pégalo aquí.</p>
        <label class="vp-f"><span>Enlace personal o llave</span><input name="k" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
        <p class="vp-msg" role="status" aria-live="polite"></p>
        <button class="btn wide" type="submit">Conectar</button>
      </form>`;
      const logo = document.querySelector("header .brand");
      if (logo) box.querySelector(".vp-logo").append(logo.cloneNode(true));
      box.querySelector("form").addEventListener("submit", connect);
      document.body.append(box);
    }
    msg(note || "", !!note);
    box.hidden = false;
    document.documentElement.classList.add("vp-locked");
    setTimeout(() => box.querySelector("input").focus(), 50);
  }
  function msg(t, bad) { const p = box.querySelector(".vp-msg"); p.textContent = t; p.classList.toggle("bad", !!bad); }
  async function connect(e) {
    e.preventDefault();
    const k = keyFrom(e.target.k.value), go = box.querySelector("button[type=submit]");
    if (!k) return msg("No encuentro una llave en lo que pegaste. Pega el enlace completo.", true);
    go.disabled = true; msg("Conectando…");
    setKey(k);
    try {
      await call("ping");
      box.hidden = true; document.documentElement.classList.remove("vp-locked");
      ready();
    } catch (err) {
      setKey("");
      msg(err.code === "offline" ? "Sin conexión. Conéctate a internet para la primera vez." : "Esa llave no es válida.", true);
    }
    go.disabled = false;
  }
})();
</script>

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));
const fmtMin = m => m > 0 && m < 1 ? "<1" : String(Math.round(m));

async function syncFromDb(db) {
  const opt = p => p.catch(e => { console.warn(e); return null; });
  const [p, itemsSnap, prof, cardsSnap, mineSnap, themesDoc] = await Promise.all([
    opt(db.doc("state/progress").get()), opt(db.collection("items").orderBy("ts", "desc").limit(500).get()),
    opt(db.doc("state/profile").get()), opt(db.collection("cards").limit(1000).get()), opt(db.collection("mine").get()),
    opt(db.doc("state/themes").get()),
  ]);
  if (themesDoc?.exists) { const v = clone(themesDoc.data()); LS.set("themes", v); applyThemeSeeds(v); }
  if (prof?.exists && typeof prof.data().text === "string") { S.profile = prof.data().text; LS.set("profile", S.profile); }

  // Progreso: gana el más reciente, pero se conservan los minutos de días que solo tenga el otro (sesiones sin conexión)
  if (p?.exists) {
    const remote = loadProgress(clone(p.data())), local = S.progress;
    const localNewer = (local.updatedAt || 0) > (remote.updatedAt || 0);
    const newer = localNewer ? local : remote, older = localNewer ? remote : local;
    for (const lang of ["en", "fr"]) {
      const a = newer.stats[lang] ||= { min: 0, readings: 0, sessions: 0, days: {} }; a.days ||= {};
      const b = older.stats?.[lang];
      if (b?.days) for (const [k, v] of Object.entries(b.days)) if (numDay(v) > numDay(a.days[k])) a.days[k] = v;
    }
    newer.deleted = [...new Set([...(newer.deleted || []), ...(older.deleted || [])])];
    S.progress = newer;
    if (localNewer) saveProgress(true);
  } else if (S.progress.updatedAt) saveProgress(true);
  LS.set("progress", S.progress);

  // Lecturas y prácticas guardadas
  const del = new Set(S.progress.deleted);
  if (itemsSnap) {
    const byId = new Map();
    itemsSnap.docs.forEach(d => { const x = clone(d.data()); if (x?.id) byId.set(x.id, x); });
    for (const x of S.items) {
      const r = byId.get(x.id);
      if (del.has(x.id)) continue;
      if (!r || (x.upd || 0) > (r.upd || 0)) { byId.set(x.id, x); const v = clone(x); queue(() => db.doc("items/" + v.id).set(v)); }
    }
    for (const id of del) if (byId.has(id)) { byId.delete(id); queue(() => db.doc("items/" + id).delete()); }
    S.items = [...byId.values()].sort((a, b) => (b.ts || 0) - (a.ts || 0));
    LS.set("items", S.items);
  }

  // Tarjetas de repaso
  if (cardsSnap) {
    const byId = new Map();
    cardsSnap.docs.forEach(d => { const c = clone(d.data()); if (c?.id) byId.set(c.id, c); });
    for (const c of S.cards) {
      const r = byId.get(c.id);
      if (!r || (c.upd || 0) > (r.upd || 0)) { byId.set(c.id, c); const v = clone(c); queue(() => db.doc("cards/" + v.id).set(v)); }
    }
    S.cards = [...byId.values()];
    LS.set("cards", S.cards);
  }

  // Migración: palabras y frases guardadas en la versión anterior pasan a ser tarjetas
  const mine = { en: { words: [], phrases: [] }, fr: { words: [], phrases: [] } };
  const legacy = LS.get("mine", null);
  for (const lang of ["en", "fr"]) {
    const add = src => { if (src) { mine[lang].words.push(...(src.words || [])); mine[lang].phrases.push(...(src.phrases || [])); } };
    add(legacy?.[lang]);
    mineSnap?.docs.forEach(d => { if (d.id === lang) add(clone(d.data())); });
    mine[lang].words.forEach(w => w?.t && addCard({ lang, type: "word", t: w.t, es: w.es || "", pron: w.pron || "", note: w.note || "" }, true));
    mine[lang].phrases.forEach(f => f?.t && addCard({ lang, type: "phrase", t: f.t, es: f.es || "", note: f.note || "" }, true));
  }
}

/* ---------- Diferencias palabra por palabra (para las correcciones) ---------- */
function diffWords(a, b) {
  const A = String(a).split(/\s+/).filter(Boolean), B = String(b).split(/\s+/).filter(Boolean);
  const n = A.length, m = B.length;
  if (n * m > 120000) return [{ t: "del", s: A.join(" ") }, { t: "ins", s: B.join(" ") }];
  const nk = w => w.toLowerCase().replace(/[.,!?;:"«»“”()]/g, "");
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = nk(A[i]) === nk(B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += " " + s; else out.push({ t, s }); };
  while (i < n && j < m) {
    if (nk(A[i]) === nk(B[j])) { push("eq", B[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) push("del", A[i++]);
    else push("ins", B[j++]);
  }
  while (i < n) push("del", A[i++]);
  while (j < m) push("ins", B[j++]);
  return out;
}
const diffHtml = (a, b) => diffWords(a, b).map(p => p.t === "eq" ? esc(p.s) : p.t === "del" ? `<del>${esc(p.s)}</del>` : `<ins>${esc(p.s)}</ins>`).join(" ");

const TTS = {
  ok: typeof window !== "undefined" && "speechSynthesis" in window,
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices() || []; };
    load();
    try { speechSynthesis.addEventListener("voiceschanged", load); } catch { speechSynthesis.onvoiceschanged = load; }
  },
  list(lang) { const w = lang === "fr" ? "fr" : "en"; return this.voices.filter(v => String(v.lang || "").toLowerCase().replace("_", "-").startsWith(w)); },
  score(v, lang) {
    const n = v.name.toLowerCase(), l = String(v.lang || "").toLowerCase().replace("_", "-");
    let s = 0;
    if (lang === "en" && (l === "en-us" || l === "en-gb")) s += 3;
    if (lang === "fr" && l === "fr-fr") s += 3;
    if (/premium|enhanced|neural|natural|mejorad|siri/.test(n)) s += 4;
    if (lang === "en" && /samantha|daniel|karen|moira|serena|ava|evan|google us english|google uk english/.test(n)) s += 2;
    if (lang === "fr" && /amélie|amelie|thomas|audrey|marie|aurélie|google français/.test(n)) s += 2;
    if (v.localService) s += 1;
    if (/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/.test(n)) s -= 8;
    return s;
  },
  voice(lang) {
    const vs = this.list(lang); if (!vs.length) return null;
    const saved = LS.get("voice:" + lang, null);
    if (saved) { const v = vs.find(v => v.voiceURI === saved || v.name === saved); if (v) return v; }
    return vs.slice().sort((a, b) => this.score(b, lang) - this.score(a, lang))[0];
  },
  rate(lang) { return S.progress.rate?.[lang] ?? (lang === "fr" ? 0.85 : 0.95); },
  utter(text, lang, rate) {
    const u = new SpeechSynthesisUtterance(plain(text).replace(/[_]{2,}/g, " "));
    u.lang = lang === "fr" ? "fr-FR" : "en-US";
    const v = this.voice(lang); if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = rate || this.rate(lang);
    return u;
  },
};
let sayTok = 0, sayBtn = null;
function stopSay() {
  sayTok++;
  if (TTS.ok) try { speechSynthesis.cancel(); } catch {}
  if (sayBtn) sayBtn.classList.remove("on");
  sayBtn = null;
  $$(".para.playing").forEach(p => p.classList.remove("playing"));
  if (S.playing) { S.playing = null; const b = $("#playall"); if (b) { b.classList.remove("on"); b.textContent = "▶ Todo"; } }
}
function say(text, lang = S.lang, btn, rate) {
  if (!TTS.ok) return toast("Este navegador no tiene voz para leer en voz alta");
  const same = btn && sayBtn === btn;
  stopSay();
  if (same) return;
  const tok = ++sayTok, u = TTS.utter(text, lang, rate);
  if (btn) { btn.classList.add("on"); sayBtn = btn; }
  u.onend = u.onerror = () => { if (tok !== sayTok) return; btn?.classList.remove("on"); sayBtn = null; };
  speechSynthesis.speak(u);
}
// Lee varios textos seguidos; onIdx(i) avisa cuál suena (-1 al terminar)
function sayQueue(texts, lang, onIdx) {
  stopSay();
  if (!TTS.ok) { toast("Este navegador no tiene voz para leer en voz alta"); return; }
  const tok = ++sayTok; let i = 0;
  const next = () => {
    if (tok !== sayTok) return;
    if (i >= texts.length) { onIdx?.(-1); return; }
    onIdx?.(i);
    const u = TTS.utter(texts[i], lang);
    u.onend = () => { if (tok !== sayTok) return; i++; next(); };
    u.onerror = () => { if (tok === sayTok) onIdx?.(-1); };
    speechSynthesis.speak(u);
  };
  next();
}

/* ===================== Repaso espaciado (tarjetas) ===================== */
// Tipos: word (palabra → significado) · phrase (español → cómo se dice) · fix (frase con error → corrección)
const cardId = (lang, type, key) => lang + "-" + type + "-" + hash(String(key).toLowerCase().replace(/\s+/g, " ").trim());
function addCard(c, silent) {
  const t = String(c.t || "").trim();
  if (!t) return false;
  const id = cardId(c.lang, c.type, c.type === "fix" ? (c.bad || t) : t);
  const ex = S.cards.find(x => x.id === id);
  if (ex && !ex.off) { if (!silent) toast("Ya está en tus tarjetas"); return false; }
  const now = Date.now();
  const card = { id, lang: c.lang, type: c.type, t, es: c.es || "", note: c.note || "", pron: c.pron || "", ctx: c.ctx || "", bad: c.bad || "", src: c.src || "", created: now, due: now, ivl: 0, ease: 2.5, reps: 0, lapses: 0, last: 0, off: false };
  if (ex) Object.assign(ex, card); else S.cards.push(card);
  persistCard(ex || card);
  if (!silent) toast(c.type === "word" ? "Palabra guardada para repasar" : "Guardada para repasar");
  updateBadge();
  return true;
}
function persistCard(c) {
  c.upd = Date.now();
  LS.set("cards", S.cards);
  if (S.db) { const v = clone(c); queue(() => S.db.doc("cards/" + c.id).set(v)); }
}
function removeCard(id) { const c = S.cards.find(x => x.id === id); if (!c) return; c.off = true; persistCard(c); updateBadge(); }
const isNewCard = c => !c.last;
const liveCards = lang => S.cards.filter(c => c.lang === lang && !c.off);
function queueFor(lang) {
  const now = Date.now(), t = todayState(), all = liveCards(lang);
  const rev = all.filter(c => !isNewCard(c) && c.due <= now).sort((a, b) => a.due - b.due);
  const left = Math.max(0, (S.progress.newPerDay || 15) - (t.newSeen[lang] || 0));
  const fresh = all.filter(isNewCard).sort((a, b) => a.created - b.created).slice(0, left);
  return { rev, fresh, ids: [...rev, ...fresh].map(c => c.id) };
}
const dueCount = lang => queueFor(lang).ids.length;
function cardStats(lang) {
  const all = liveCards(lang);
  return { total: all.length, nuevas: all.filter(isNewCard).length, aprendiendo: all.filter(c => !isNewCard(c) && c.ivl < 21).length, dominadas: all.filter(c => c.ivl >= 21).length };
}
// Algoritmo simple tipo SM-2: g = 0 otra vez · 1 difícil · 2 bien · 3 fácil
function nextState(c, g) {
  let { ease = 2.5, ivl = 0, reps = 0, lapses = 0 } = c;
  if (g === 0) return { ease: Math.max(1.3, ease - 0.2), ivl: 0, reps: 0, lapses: lapses + (reps > 0 ? 1 : 0), dueIn: 10 / 1440 };
  let n = reps === 0 ? [0, 0.5, 1, 3][g] : g === 1 ? Math.max(1, ivl * 1.2) : g === 2 ? Math.max(ivl + 1, ivl * ease) : Math.max(ivl + 2, ivl * ease * 1.3);
  ease = g === 1 ? Math.max(1.3, ease - 0.15) : g === 3 ? ease + 0.15 : ease;
  n = Math.min(n, 365);
  return { ease, ivl: n, reps: reps + 1, lapses, dueIn: n };
}
function ivlLabel(days) {
  if (days < 1 / 24) return "10 min";
  if (days < 1) return Math.round(days * 24) + " h";
  if (days < 30) return Math.round(days) + " d";
  if (days < 365) return Math.round(days / 30) + " mes";
  return Math.round(days / 365) + " año";
}
function schedule(c, g) {
  const s = nextState(c, g), now = Date.now(), wasNew = isNewCard(c);
  Object.assign(c, { ease: s.ease, ivl: s.ivl, reps: s.reps, lapses: s.lapses, due: now + s.dueIn * DAY, last: now });
  persistCard(c);
  if (wasNew) { const t = todayState(); t.newSeen[c.lang] = (t.newSeen[c.lang] || 0) + 1; saveProgress(); }
}
function updateBadge() {
  const b = $("#badge-hoy"); if (!b) return;
  const n = dueCount(S.lang);
  b.hidden = !n; b.textContent = n > 99 ? "99+" : String(n);
}

/* ---------- Sesión de repaso ---------- */
function startReview(lang = S.lang) {
  const q = queueFor(lang);
  if (!q.ids.length) {
    toast(liveCards(lang).length ? "No tienes tarjetas pendientes. ¡Estás al día!" : "Aún no tienes tarjetas: toca palabras al leer y guárdalas");
    if (liveCards(lang).length) { markDone("review", lang); render(); }
    return;
  }
  stopSay();
  S.sub = { kind: "review", tab: S.tab, lang, queue: q.ids.slice(0, 40), i: 0, shown: false, done: 0, again: 0, t0: Date.now() };
  render(); scrollTo(0, 0);
}
function hiCtx(ctx, term) {
  const e = esc(ctx), t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try { return e.replace(new RegExp("(" + t + ")", "i"), "<b>$1</b>"); } catch { return e; }
}
function viewReview() {
  const s = S.sub;
  if (s.i >= s.queue.length) {
    if (!s.logged) { s.logged = true; logTime(s.lang, "review", Date.now() - s.t0); markDone("review", s.lang); updateBadge(); }
    const left = dueCount(s.lang);
    return `<div class="stack"><p class="eyebrow">Repaso terminado</p><h1>${s.done} ${s.done === 1 ? "tarjeta repasada" : "tarjetas repasadas"}</h1>
      <p class="lead">${s.again ? (s.again === 1 ? "Una tarjeta te costó y volverá pronto." : `${s.again} tarjetas te costaron y volverán pronto.`) + " Es normal: así se fijan." : "Todo salió bien. Las tarjetas volverán en unos días."}</p>
      ${left ? `<button class="btn ghost" data-act="review-more">Seguir con ${left} más</button>` : ""}
      <button class="btn" data-act="back">Volver</button></div>`;
  }
  const c = S.cards.find(x => x.id === s.queue[s.i]);
  if (!c) { s.i++; return viewReview(); }
  const kind = { word: "Palabra", phrase: "Quiero decir…", fix: "Corrige la frase" }[c.type] || "Tarjeta";
  const front = c.type === "word"
    ? `<div class="front">${esc(c.t)}</div>${c.ctx ? `<p class="ctx">${hiCtx(c.ctx, c.t)}</p>` : ""}<button class="say" data-act="say" data-say="${esc(c.t)}" data-lang="${c.lang}" aria-label="Escuchar">▶</button>`
    : c.type === "phrase" ? `<div class="front">${esc(c.es)}</div><p class="hint">Dilo en voz alta en ${LANG_NAME[c.lang]} antes de mirar.</p>`
    : `<div class="front" lang="${c.lang}">${esc(c.bad)}</div><p class="hint">Di la versión correcta en voz alta.</p>`;
  const back = c.type === "word"
    ? `<p class="meaning">${esc(c.es)}</p>${c.pron ? `<p class="hint"><i>${esc(c.pron)}</i></p>` : ""}${c.note ? `<p class="hint">${esc(c.note)}</p>` : ""}`
    : `<p class="t" style="font-family:var(--read);font-size:1.25rem" lang="${c.lang}">${md(c.t)}</p>
       <button class="btn quiet small" data-act="say" data-say="${esc(c.t)}" data-lang="${c.lang}">▶ Escuchar</button>${c.note ? `<p class="hint">${md(c.note)}</p>` : ""}`;
  const g = [0, 1, 2, 3].map(x => ivlLabel(nextState(c, x).dueIn));
  return `<div class="back"><button class="btn quiet small" data-act="back">← Salir</button><span class="tag">${s.i + 1} de ${s.queue.length}</span></div>
  <div class="prog"><i style="width:${(s.i / s.queue.length) * 100}%"></i></div>
  <div class="card flash"><span class="kind">${kind}</span>${front}
    ${s.shown ? `<div class="backside">${back}</div>` : ""}
  </div>
  ${s.shown
    ? `<div class="grades" role="group" aria-label="¿Qué tal te salió?">
        <button class="g0" data-act="grade" data-arg="0">Otra vez<small>${g[0]}</small></button>
        <button data-act="grade" data-arg="1">Difícil<small>${g[1]}</small></button>
        <button class="g2" data-act="grade" data-arg="2">Bien<small>${g[2]}</small></button>
        <button data-act="grade" data-arg="3">Fácil<small>${g[3]}</small></button></div>`
    : `<button class="btn wide" data-act="show-card">Mostrar respuesta</button>`}`;
}
function gradeCard(g) {
  const s = S.sub, c = S.cards.find(x => x.id === s.queue[s.i]);
  if (!c) return;
  schedule(c, g);
  s.done++;
  if (g === 0) { s.again++; s.queue.splice(Math.min(s.i + 4, s.queue.length), 0, c.id); }
  s.i++; s.shown = false;
  stopSay(); render();
}

function greet() {

function ring(mins, goal) {

    <div class="rv"><div><b>${fmtMin(mins)}</b><span>de ${goal} min</span></div></div></div>`;
}
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / DAY);

// Lectura sugerida: una guardada sin leer, luego una para releer, luego una nueva
function readSuggestion(lang) {
  const draft = LS.get("draft:" + lang, null);
  if (draft?.text) return { kind: "draft", title: "Continúa tu lectura", sub: titleOf(draft.text), min: draft.min || 5 };
  const rs = S.items.filter(x => x.kind === "reading" && x.lang === lang);
  const unread = rs.filter(x => !x.reads).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
  if (unread) return { kind: "item", id: unread.id, title: "Lee un texto guardado", sub: unread.title, min: unread.min || 5 };
  const reread = rs.filter(x => x.reads === 1 && (Date.now() - (x.lastRead || x.ts || 0)) < 21 * DAY && (Date.now() - (x.lastRead || x.ts || 0)) > 0.5 * DAY).sort((a, b) => (a.lastRead || a.ts || 0) - (b.lastRead || b.ts || 0))[0];
  if (reread) return { kind: "item", id: reread.id, title: "Relee un texto (2.ª vez)", sub: reread.title + " · releer da fluidez", min: reread.min || 5 };
  return { kind: "new", title: `Lectura nueva de ${pickSt.min} min`, sub: "Tema: " + (pickSt.topic || SURPRISE), min: pickSt.min };
}

/* ---------- Gráfico de barras apiladas (minutos por día y por idioma) ---------- */
const chartLegend = () => `<div class="legend" aria-hidden="true"><span><i style="background:var(--chart-en)"></i>English</span><span><i style="background:var(--chart-fr)"></i>Français</span></div>`;
function niceMax(v) { const steps = [10, 20, 30, 40, 60, 80, 120, 160, 240]; return steps.find(s => s >= v) || Math.ceil(v / 60) * 60; }
function weekChart(n) {
  const days = [];
  for (let i = n - 1; i >= 0; i--) { const d = dateN(i), k = dayKey(d); days.push({ d, k, en: dayMin(k, "en"), fr: dayMin(k, "fr") }); }
  const goal = S.progress.goal || 15;
  const max = niceMax(Math.max(goal, ...days.map(x => x.en + x.fr)));
  const W = Math.round(clamp(Math.min(760, document.documentElement.clientWidth || 360) - 66, 280, 700)), H = 150, L = 30, R = 6, T = 12, B = 24, pw = W - L - R, ph = H - T - B, band = pw / n, bw = Math.min(24, band * 0.56);
  const y = v => T + ph - (v / max) * ph;
  const topRound = (x, yy, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${yy + h}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + w - r}Q${x + w},${yy} ${x + w},${yy + r}V${yy + h}Z`; };
  const sq = (x, yy, w, h) => `M${x},${yy}h${w}v${h}h${-w}Z`;
  const wd = d => { try { return new Intl.DateTimeFormat("es-CL", { weekday: "narrow" }).format(d).toUpperCase(); } catch { return ""; } };
  let marks = "", hits = "", labels = "";
  days.forEach((x, i) => {
    const cx = L + band * (i + 0.5), x0 = cx - bw / 2, base = T + ph;
    const hEn = (x.en / max) * ph, hFr = (x.fr / max) * ph, gap = hEn > 0 && hFr > 0 ? 2 : 0;
    if (hEn > 0) marks += `<path d="${hFr > 0 ? sq(x0, base - hEn, bw, hEn) : topRound(x0, base - hEn, bw, hEn, 4)}" fill="var(--chart-en)"/>`;
    if (hFr > 0) marks += `<path d="${topRound(x0, base - hEn - gap - hFr, bw, hFr, 4)}" fill="var(--chart-fr)"/>`;
    const last = i === n - 1;
    labels += `<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle"${last ? ' style="font-weight:700;fill:var(--ink)"' : ""}>${last ? "Hoy" : wd(x.d)}</text>`;
    if (last && x.en + x.fr > 0) labels += `<text class="ax" x="${cx}" y="${base - hEn - gap - hFr - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${fmtMin(x.en + x.fr)}</text>`;
    hits += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${ph}" tabindex="0" data-tip="${esc(cap(fmtDay(x.d, { weekday: "long", day: "numeric", month: "short" })))}|${fmtMin(x.en)}|${fmtMin(x.fr)}" aria-label="${esc(fmtDay(x.d))}: ${fmtMin(x.en)} min inglés, ${fmtMin(x.fr)} min francés"/>`;
  });
  const grid = [0, max / 2, max].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join("");
  const goalLine = `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--muted)" stroke-width="1" opacity=".55"/><text class="ax" x="${W - R}" y="${y(goal) - 4}" text-anchor="end">meta ${goal}</text>`;
  const table = `<details class="table"><summary>Ver como tabla</summary><table><tr><th>Día</th><th>English</th><th>Français</th></tr>${days.map(x => `<tr><td>${esc(fmtDay(x.d, { weekday: "short", day: "numeric" }))}</td><td>${fmtMin(x.en)}</td><td>${fmtMin(x.fr)}</td></tr>`).join("")}</table></details>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de práctica por día">${grid}${goalLine}${marks}${labels}${hits}</svg><div class="tip" hidden></div></div><p class="hint">Minutos por día</p>${table}`;
}
function chartTip(el, show) {
  const box = el.closest(".chart"), tip = box?.querySelector(".tip");
  if (!tip) return;
  if (!show) { tip.hidden = true; return; }
  const [d, en, fr] = el.dataset.tip.split("|");
  tip.innerHTML = `<div>${esc(d)}</div><div><span class="k" style="background:var(--chart-en)"></span><b>${en}</b> min English</div><div><span class="k" style="background:var(--chart-fr)"></span><b>${fr}</b> min Français</div>`;
  const r = el.getBoundingClientRect(), br = box.getBoundingClientRect();
  tip.style.left = clamp(r.left - br.left + r.width / 2, 70, br.width - 70) + "px";
  tip.style.top = (r.top - br.top + 8) + "px";
  tip.hidden = false;
}

/* Convierte el texto generado en partes: párrafos, preguntas, "así se dice", vocabulario, notas y tarea final */
function parseDoc(text) {
  const d = { title: "", paras: [], say: [], gloss: [], notes: [], quiz: [], retell: "" };
  let sec = null;
  for (const raw of String(text || "").split("\n")) {
    const l = raw.trim(); if (!l) continue;
    if (l.startsWith("## ")) {
      const h = l.slice(3).trim(), hl = h.toLowerCase();
      sec = /as[ií] se dice|frases clave/.test(hl) ? "say" : /vocabul/.test(hl) ? "gloss" : /comprueba|pregunta|comprens/.test(hl) ? "quiz" : /cu[eé]ntalo/.test(hl) ? "retell" : "notes";
      if (sec === "notes") d.notes.push({ h, items: [] });
      continue;
    }
    if (l.startsWith("# ")) { d.title = l.slice(2).trim(); continue; }
    const item = l.replace(/^[-•*]\s+/, "");
    if (sec === "say") {
      const [es, rest] = item.includes("=>") ? item.split("=>").map(s => s.trim()) : ["", item];
      const m = rest.match(/^(.*?)\s+[—–-]\s+(.*)$/);
      const t = (m ? m[1] : rest).replace(/\*\*/g, "").trim(), note = m ? m[2].trim() : "";
      if (t) d.say.push(es ? { es, t, note } : { es: note || t, t, note: "" });
    } else if (sec === "gloss") {
      const parts = item.split("|").map(s => s.trim());
      if (parts.length >= 2 && parts[0]) d.gloss.push({ t: parts[0].replace(/\*\*/g, ""), es: parts[1], pron: parts[2] || "" });
    } else if (sec === "quiz") {
      const qm = item.match(/^\d+[.)]\s*(.+)$/), om = item.match(/^[a-dA-D][.)]\s*(.+)$/);
      if (qm) d.quiz.push({ q: qm[1], opts: [], a: -1 });
      else if (om && d.quiz.length) { const q = d.quiz[d.quiz.length - 1]; let o = om[1].trim(); if (/\*\s*$/.test(o)) { o = o.replace(/\s*\*\s*$/, ""); q.a = q.opts.length; } q.opts.push(o); }
    } else if (sec === "retell") d.retell += (d.retell ? " " : "") + item;
    else if (sec === "notes") d.notes[d.notes.length - 1].items.push(item);
    else if (/^ES:/i.test(l)) { if (d.paras.length) d.paras[d.paras.length - 1].es = l.slice(3).trim(); }
    else d.paras.push({ t: l, es: "" });
  }
  d.quiz = d.quiz.filter(q => q.opts.length >= 2 && q.a >= 0);
  return d;
}

    </div></details>`).join("")}

  const saved = new Set(liveCards(r.lang).filter(c => c.type === "word").map(c => c.t.toLowerCase()));
  const vocab = d.gloss.length ? `<details class="tipx"><summary>Vocabulario de este texto (${d.gloss.length})</summary><div class="body" style="max-width:none">

    <div class="vocab">${d.gloss.map((g, i) => `<b>${esc(g.t)}</b><span>${esc(g.es)}${g.pron ? ` · <i>${esc(g.pron)}</i>` : ""}</span><button class="plus" data-act="save-vocab" data-arg="${i}" aria-label="Guardar ${esc(g.t)}" ${saved.has(g.t.toLowerCase()) ? "disabled" : ""}>${saved.has(g.t.toLowerCase()) ? "✓" : "+"}</button>`).join("")}</div></div></details>` : "";
  const notes = d.notes.map(n => `<h3>${esc(n.h)}</h3><ul>${n.items.map(x => `<li>${md(x)}</li>`).join("")}</ul>`).join("");
  const retell = `<div class="notes"><h3>Cuéntalo tú</h3><p>${d.retell ? md(d.retell) : r.lang === "en" ? "Cuenta en voz alta, en 4 a 6 frases, de qué trataba el texto y qué opinas. Usa al menos un present perfect y un past simple." : "Cuenta en voz alta, en 3 a 5 frases muy simples, de qué trataba el texto."}</p>
    <button class="btn ghost" data-act="retell">Decirlo y que me corrijan</button></div>`;
  return `<h2 class="rt">${esc(d.title)}</h2>${paras}${quiz}${say}${vocab}${notes ? `<div class="notes">${notes}</div>` : ""}${retell}`;
}

async function generateReading() {
  if (!canAI()) return;
  const lang = S.lang, min = pickSt.min;
  S.busy = true; S.ctl = new AbortController();
  stopSay();
  S.reading = { id: uid(), lang, min, level: level(lang).k, topic: pickSt.topic, text: "", generating: true, showTr: false, open: {}, tr: {}, quiz: {}, startedAt: Date.now() };
  render(); scrollTo(0, 0);
  let last = 0;
  const r = S.reading;
  try {
    const res = await S.sample(readingPrompt(lang, min, pickSt.topic), {
      cache: false, signal: S.ctl.signal,
      onText: ({ text }) => { r.text = text; const now = Date.now(); if (now - last > 450 && S.reading === r) { last = now; const d = $("#doc"); if (d) d.innerHTML = renderDoc(r); } },
    });
    r.text = res.text;
    if (res.truncated) r.note = "El texto se cortó por largo; igual puedes leerlo y guardarlo.";
  } catch (e) {
    if (e?.text) r.text = e.text;
    if (e?.code !== "cancelled") r.note = errMsg(e);
    if (!r.text) { S.busy = false; if (S.reading === r) S.reading = null; render(); if (r.note) toast(r.note); return; }
  }
  S.busy = false; r.generating = false; r.startedAt = Date.now();
  if (S.reading === r) { persistReading(); render(); }
}
function persistReading() {
  const r = S.reading; if (!r || r.generating) return;
  if (r.saved) { const x = S.items.find(i => i.id === r.id); if (x) saveItem({ ...x, tr: r.tr || {} }); }
  else LS.set("draft:" + r.lang, { ...r, startedAt: 0, title: titleOf(r.text) });
}
function resumeDraft() {
  const dr = LS.get("draft:" + S.lang, null);
  if (!dr?.text) return render();
  S.reading = { ...dr, open: dr.open || {}, tr: dr.tr || {}, quiz: {}, startedAt: Date.now(), generating: false };
  S.tab = "leer"; render(); scrollTo(0, 0);
}
async function toggleEs(i, btn) {
  const r = S.reading, p = parseDoc(r.text).paras[i], el = document.querySelector(`[data-tr="${i}"]`);
  if (!p || !el) return;
  r.open ||= {}; r.tr ||= {};
  if (!el.hidden) { r.open[i] = false; el.hidden = true; btn.classList.remove("on"); return; }
  r.open[i] = true; el.hidden = false; btn.classList.add("on");
  const known = p.es || r.tr[i];
  if (known) { el.textContent = known; return; }
  if (!S.sample) { el.textContent = "La traducción de este párrafo necesita abrir la app dentro de Claude."; return; }
  el.textContent = "Traduciendo…";
  try {
    const res = await S.sample(`Translate this ${r.lang === "en" ? "English" : "French"} paragraph into natural, neutral Latin American Spanish. Keep the meaning exact. Reply with only the translation.\n\n${plain(p.t)}`, { modelTier: "quick" });
    r.tr[i] = res.text.trim(); el.textContent = r.tr[i]; persistReading();
  } catch (e) { el.textContent = errMsg(e); }
}
function playAll() {
  const r = S.reading; if (!r) return;
  if (S.playing) return stopSay();
  const paras = parseDoc(r.text).paras;
  S.playing = { i: 0 };
  const b = $("#playall"); if (b) { b.classList.add("on"); b.textContent = "■ Parar"; }
  sayQueue(paras.map(p => p.t), r.lang, i => {
    $$(".para.playing").forEach(p => p.classList.remove("playing"));
    if (i < 0) { S.playing = null; const bb = $("#playall"); if (bb) { bb.classList.remove("on"); bb.textContent = "▶ Todo"; } return; }
    if (S.playing) S.playing.i = i;
    const el = document.querySelector(`.para[data-p="${i}"]`);
    if (el) { el.classList.add("playing"); const rc = el.getBoundingClientRect(); if (rc.top < 80 || rc.bottom > innerHeight - 150) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); }
  });
}
function finishReading() {
  const r = S.reading; if (!r) return;
  const ms = Date.now() - (r.startedAt || Date.now()), minutes = ms / 60000;
  const words = parseDoc(r.text).paras.map(p => plain(p.t)).join(" ").split(/\s+/).filter(Boolean).length;
  const wpm = minutes >= 1 ? Math.round(words / minutes) : 0;
  const prev = S.items.find(x => x.id === r.id);
  const reads = (prev?.reads || 0) + 1;
  saveItem({ ...(prev || {}), id: r.id, kind: "reading", lang: r.lang, min: r.min, level: r.level || prev?.level || "", topic: r.topic || prev?.topic || "", title: titleOf(r.text), text: r.text, tr: r.tr || {}, ts: prev?.ts || Date.now(), date: prev?.date || today(), reads, lastRead: Date.now() });
  logTime(r.lang, "reading", Math.min(ms, r.min * 2 * 60000));
  if (wpm > 30 && wpm < 400) { const a = S.progress.wpm[r.lang] ||= []; a.push({ d: today(), wpm }); if (a.length > 30) a.shift(); saveProgress(); }
  markDone("read", r.lang);
  LS.set("draft:" + r.lang, null);
  stopSay(); S.reading = null; render(); scrollTo(0, 0);
  toast((reads > 1 ? `Lectura n.º ${reads} terminada` : "Lectura guardada") + (wpm > 30 && wpm < 400 ? ` · ~${wpm} palabras por minuto` : ""), 3600);
}

/* ---------- Toca una palabra: significado ---------- */
let lookupSeq = 0;
function currentGloss() {
  const own = liveCards(S.lang).filter(c => c.type === "word");
  if (S.tab === "leer" && S.reading) return parseDoc(S.reading.text).gloss.concat(own);
  return own;
}
function findGloss(word, sentence) {
  const lw = word.toLowerCase(), ls = sentence.toLowerCase(), g = currentGloss();
  const toks = x => String(x.t).toLowerCase().replace(/\(.*?\)/g, "").split(/[\s/,]+/).filter(Boolean);
  return g.find(x => String(x.t).toLowerCase() === lw)
    || g.find(x => toks(x).includes(lw) && toks(x).length > 1 && ls.includes(String(x.t).toLowerCase().replace(/\(.*?\)/g, "").trim()))
    || g.find(x => toks(x).length === 1 && toks(x)[0] === lw);
}
const sentenceOf = (text, word) => { const parts = String(text).match(/[^.!?…]+[.!?…]*/g) || [String(text)]; return (parts.find(s => s.toLowerCase().includes(word.toLowerCase())) || parts[0] || "").trim(); };
function langOf(el) {
  const l = el.closest("#view [lang], #sheet [lang]")?.getAttribute("lang");
  if (l === "en" || l === "fr") return l;
  return S.reading && S.tab === "leer" ? S.reading.lang : S.sub?.lang || S.lang;
}
async function lookup(span) {
  $$(".w.sel").forEach(x => x.classList.remove("sel"));
  span.classList.add("sel");
  const lang = langOf(span);
  const word = span.textContent, full = (span.closest(".ctx")?.textContent || word).replace(/\s+/g, " ").trim(), sentence = sentenceOf(full, word);
  const hit = findGloss(word, full);
  if (hit) return showSheet({ t: hit.t, es: hit.es, pron: hit.pron || "", note: hit.note || "", ctx: sentence }, lang);
  const key = lang + "|" + word.toLowerCase() + "|" + sentence.slice(0, 160);
  S.lk ||= {};
  if (S.lk[key]) return showSheet(S.lk[key], lang);
  if (!S.sample) return showSheet({ t: word, es: "Para ver el significado de cualquier palabra, abre la app dentro de Claude. Las palabras subrayadas sí tienen significado sin conexión." }, lang, true);
  const seq = ++lookupSeq;
  showSheet({ t: word, loading: true }, lang);
  try {
    const res = await S.sample.json(`A Spanish speaker learning ${lang === "en" ? "English" : "French"} tapped the word "${word}" in this sentence:
"${sentence.slice(0, 600)}"
Reply with ONLY JSON: {"t": the word, or the whole expression it belongs to here (phrasal verb, fixed expression), "base": dictionary form if different (infinitive, singular, masculine) or "", "es": meaning in Spanish IN THIS CONTEXT (short), "pron": approximate pronunciation written for a Spanish speaker, "note": one short sentence in Spanish on usage or grammar (for a conjugated verb: tense and person), or ""}`, { modelTier: "quick" });
    if (seq !== lookupSeq) return;
    const e = { t: String(res.t || word), base: String(res.base || ""), es: String(res.es || ""), pron: String(res.pron || ""), note: String(res.note || ""), ctx: sentence };
    S.lk[key] = e; showSheet(e, lang);
  } catch (err) { if (seq === lookupSeq) showSheet({ t: word, es: errMsg(err) }, lang, true); }
}
function showSheet(e, lang, noSave) {
  S.sheet = { ...e, lang };
  const saved = liveCards(lang).some(c => c.type === "word" && c.t.toLowerCase() === String(e.t).toLowerCase());
  $("#sheet-in").innerHTML = `<div class="sheet-head"><div><div class="term" lang="${lang}">${esc(e.t)}</div>
    ${e.base && e.base.toLowerCase() !== String(e.t).toLowerCase() ? `<div class="pron">de: ${esc(e.base)}</div>` : ""}${e.pron ? `<div class="pron">${esc(e.pron)}</div>` : ""}</div>
    <button class="x" data-act="sheet-close" aria-label="Cerrar">×</button></div>
    ${e.loading ? `<p class="thinking"><span class="dot"></span>Buscando el significado…</p>`
      : `<p style="font-size:1.05rem">${esc(e.es)}</p>${e.note ? `<p class="hint">${esc(e.note)}</p>` : ""}
      ${noSave ? "" : `<div class="row"><button class="btn quiet small" data-act="sheet-say">▶ Escuchar</button><button class="btn ghost small" data-act="sheet-save" ${saved ? "disabled" : ""}>${saved ? "Ya está para repasar" : "Guardar para repasar"}</button></div>`}`}`;
  $("#sheet").hidden = false;
}
function closeSheet() { const s = $("#sheet"); if (s) s.hidden = true; S.sheet = null; $$(".w.sel").forEach(x => x.classList.remove("sel")); }
setInterval(() => { const t = $("#timer"), r = S.reading; if (t && r && !r.generating && r.startedAt) { const s = Math.floor((Date.now() - r.startedAt) / 1000); t.textContent = Math.floor(s / 60) + ":" + pad2(s % 60); } }, 1000);

function renderFix(res, L) {

function buildConj({ verbs, tenses, n = 10 }) {
  const items = [], weak = weakOrder(tenses, "fr").map(x => x.k);
  for (let k = 0; k < n * 6 && items.length < n; k++) {

    const forms = frConj(inf, tense), idxs = forms.map((x, i) => x ? i : -1).filter(i => i >= 0), i = pick(idxs), key = inf + tense + i;
