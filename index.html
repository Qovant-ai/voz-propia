  return list.map(v => `<button data-act="verb-open" data-arg="${esc(v.fr)}" class="${v.i < idx ? "seen" : ""}"><b lang="fr">${esc(v.fr)}</b><small>${v.i + 1}. ${esc(v.es)}</small></button>`).join("") || `<p class="empty">Sin resultados</p>`;
}
function viewVerbs() {
  const q = S.sub.q || "";
  return `<div class="back"><button class="btn quiet small" data-act="back">← Volver</button><span class="tag">100 verbos</span></div>
  <h1>Tus 100 verbos</h1><p class="lead">Ordenados por frecuencia: los primeros 20 cubren buena parte de lo que se dice cada día. Toca uno para ver todas sus formas.</p>
  <input type="search" id="verb-q" placeholder="Buscar en francés o en español" value="${esc(q)}">
  <div class="verbs" id="verb-grid">${verbGrid(q)}</div>`;
}
function openVerb(inf) { stopSay(); S.sub = { kind: "conjtable", tab: S.tab, lang: "fr", inf, from: S.sub?.kind === "verbs" ? "verbs" : "" }; render(); scrollTo(0, 0); }

/* ---------- Generadores con IA ---------- */
async function genJSON(prompt, label) {
  if (!canAI()) return null;
  S.busy = true; S.ctl = new AbortController();
  $("#view").innerHTML = `<p class="thinking"><span class="dot"></span>${esc(label)}</p><button class="btn quiet" data-act="stop-gen">Cancelar</button>`;
  try { return await S.sample.json(prompt, { cache: false, signal: S.ctl.signal }); }
  catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); return null; }
  finally { S.busy = false; }
}
async function genDrillAI() {
  const weak = weakOrder(Object.keys(CATS), "en").slice(0, 3).map(x => CATS[x.k]).join(", ");
  const data = await genJSON(`Create 12 fill-in-the-blank English grammar items for a Spanish-speaking adult. ${levelLine("en")} Natural, varied, adult sentences, first person when possible, about: ${themeHint()}. Categories (field "c") must be one of: ${Object.keys(CATS).join(", ")} meaning: ${JSON.stringify(CATS)}. Give extra weight to: ${weak}. Seed for variety: ${uid()}.${aboutMe()}
Reply with ONLY a JSON array of 12 objects: {"c": category key, "q": sentence with ___ for each blank, "o": array of exactly 4 short options (if two blanks, write each option as "x / y"), "a": index 0-3 of the only correct option (vary its position), "w": explanation IN SPANISH, 1-2 sentences, with the rule and a quick trick}.`, "Creando ejercicios nuevos según tus errores…");
  const ok = Array.isArray(data) ? data.filter(x => x && typeof x.q === "string" && x.q.includes("___") && Array.isArray(x.o) && x.o.length >= 2 && Number.isInteger(x.a) && x.o[x.a] != null) : [];
  if (ok.length) startDrill(ok.map((it, i) => i % 3 === 2 && singleBlank(it) ? asType(it) : asMC(it)), { title: "Ejercicios nuevos", lang: "en", fresh: true });
  else render();
}
async function genPhrasesAI() {
  const data = await genJSON(`Write 8 natural, spoken English sentences in FIRST PERSON, one step above this level: ${level("en").p}, that the speaker would really say (topics: ${themeHint()}), each built around perfect tenses, was/were, had been/have been or modal perfects, plus one idiomatic chunk. Wrap the key verb phrase in **double asterisks**. Seed: ${uid()}.${aboutMe()}
Reply with ONLY a JSON array of 8 objects: {"t": sentence, "es": natural Spanish translation, "note": IN SPANISH: the pattern, when to use it and one pronunciation hint}.`, "Escribiendo frases nuevas…");
  const ok = Array.isArray(data) ? data.filter(x => x && x.t && x.es) : [];
  if (ok.length) startCards(ok, "Frases nuevas", "en", true); else render();
}
async function genVerbsAI() {
  let idx = S.progress.frVerbIdx || 0; if (idx >= 100) idx = 0;
  const batch = FR_VERBS.slice(idx, idx + 10);
  const data = await genJSON(`Pour un hispanophone qui apprend le français. ${levelLine("fr")} Pour CHACUN de ces 10 verbes : ${batch.map(v => v.fr).join(", ")} — écris 3 phrases très utiles à la première personne ou dans un mini-dialogue, une par temps parmi : ${FR_TENSES_BY_LEVEL[level("fr").k].map(t => FR_CATS[t]).join(", ")} (si le niveau n'a que deux temps, fais deux phrases au présent). Utilise parfois des nombres en lettres, jours ou mois. Thèmes possibles : ${themeHint()} (en version simple). Mets le verbe conjugué entre **doubles astérisques**. Graine : ${uid()}.
Réponds UNIQUEMENT avec un tableau JSON de 30 objets : {"tag": "infinitif · temps" (ex: "aller · passé composé"), "t": phrase en français, "es": traducción al español, "note": EN ESPAGNOL: conjugación usada (persona, auxiliar si aplica) + pronunciación figurada de la parte difícil}.`, `Creando frases con: ${batch.map(v => v.fr).join(", ")}…`);
  const ok = Array.isArray(data) ? data.filter(x => x && x.t && x.es) : [];
  if (!ok.length) return render();
  startCards(ok, `Verbos ${idx + 1}–${idx + batch.length}`, "fr", true);
  S.sub.advance = idx + batch.length;
}

/* ---------- Abrir prácticas desde el menú ---------- */
function goPractice(arg) {
  const L = S.lang;
  if (arg === "quick") return startDrill(buildWarmupEN(), { title: "Ejercicio express", lang: "en" });
  if (arg === "errors") return startDrill(judgeItems(null, 10), { title: "Encuentra el error", lang: "en" });
  if (arg === "irreg") return startDrill(buildIrreg(10), { title: "Verbos irregulares", lang: "en" });
  if (arg === "phrases") return startCards(EN_PHRASES, "Frases avanzadas", "en", false);
  if (arg === "ai-drill") return genDrillAI();
  if (arg === "ai-phrases") return genPhrasesAI();
  if (arg.startsWith("cat:")) { const c = arg.slice(4); const items = [...enItems(c, 6), ...judgeItems([c], 2)]; return startDrill(shuffle(items.length ? items : buildWarmupEN()), { title: CATS[c], lang: "en" }); }
  if (arg.startsWith("tense:")) return startDrill(buildConj({ verbs: frPool(Math.max(25, conjCfg.size)), tenses: [arg.slice(6)], n: 10 }), { title: FR_CATS[arg.slice(6)], lang: "fr" });
  if (arg === "conj") { const tenses = conjCfg.tenses?.length ? conjCfg.tenses : FR_TENSES_BY_LEVEL[level("fr").k]; return startDrill(buildConj({ verbs: frPool(conjCfg.size), tenses, n: 10 }), { title: "Conjugación", lang: "fr" }); }
  if (arg === "verbs") { stopSay(); S.sub = { kind: "verbs", tab: S.tab, lang: "fr", q: "" }; render(); return scrollTo(0, 0); }
  if (arg === "nums") { S.sub = { kind: "nums", tab: S.tab, lang: "fr", range: "0–20", mode: "say", count: 0, ok: 0, t0: Date.now() }; newNum(); render(); return scrollTo(0, 0); }
  if (arg === "time") { S.sub = { kind: "time", tab: S.tab, lang: "fr", what: "time", mode: "say", count: 0, ok: 0, t0: Date.now() }; newTime(); render(); return scrollTo(0, 0); }
  if (arg === "days") return startCards(FR_DAYS, "Les jours de la semaine", "fr", false);
  if (arg === "months") return startCards(FR_MONTHS, "Les mois de l'année", "fr", false);
  if (arg === "ai-verbs") return genVerbsAI();
  if (arg === "blocks") return startBlocks();
  if (arg === "songs") return startSongs(L);
  if (L) render();
}

/* ---- 75-blocks.js ---- */
/* ===================== Practicar → Bloques (francés): bloques → escuchar → decirlo tú ===================== */
// Una lección se da por aprendida cuando entiendes y dices al menos 7 de sus 10 frases; si no, se propone repetirla.
// Las lecciones del nivel 2 van intercaladas con las del 1 (BLK_ORDER) y cada lección mezcla 3 frases de repaso de las anteriores.
const BLK_PASS = 7;
const blkStore = () => (S.progress.blocks ||= {});
const blkLearned = n => { const r = blkStore()[n]; return !!r && r.ear >= BLK_PASS && r.say >= BLK_PASS; };
const blkNext = () => FR_BLOCKS.find(l => !blkLearned(l.n)) || null;
const blkKnown = () => FR_BLOCKS.filter(l => blkLearned(l.n));
const blkItems = l => l.s.map(([fr, es, note]) => ({ fr, es, note: note || "" }));
const blkPos = l => FR_BLOCKS.indexOf(l) + 1;
const blkLabel = l => `Lección ${blkPos(l)}${l.lv === 2 ? " · nivel 2" : ""}`;
// Frases de lecciones anteriores ya aprendidas, para intercalarlas en la lección nueva
function blkReview(l, k = 3) {
  const before = FR_BLOCKS.slice(0, FR_BLOCKS.indexOf(l)).filter(x => blkLearned(x.n));
  return shuffle(before.flatMap(x => blkItems(x).map(it => ({ ...it, rev: x.title })))).slice(0, k);
}
// Lo que ya sabe, para que las lecturas y las frases nuevas lo reciclen
function blkKnownLine() {
  const k = blkKnown(); if (!k.length) return "";
  return ` Blocs déjà appris par l'élève, à recycler en priorité : ${k.flatMap(l => l.b.map(b => b[0])).slice(0, 90).join(" ; ")}.`;
}

function startBlocks() { stopSay(); S.sub = { kind: "blocks", tab: S.tab, lang: "fr", stage: "list" }; render(); scrollTo(0, 0); }
function startBlockSession(o) {
  stopSay();
  S.sub = { kind: "blocks", tab: S.tab, lang: "fr", stage: o.stage || "learn", n: o.n || 0, title: o.title, idea: o.idea || "", blocks: o.blocks || [], hunt: o.hunt || [],
    items: o.items, i: 0, shown: false, ear: {}, said: {}, t0: Date.now(), src: o.src || "", fresh: !!o.fresh };
  render(); scrollTo(0, 0);
}
function startBlockLesson(n, src) {
  const l = FR_BLOCKS.find(x => x.n === n); if (!l) return;
  const items = blkItems(l);
  blkReview(l).forEach((r, k) => items.splice(3 + k * 4, 0, r));
  startBlockSession({ n, title: `${blkLabel(l)} · ${l.title}`, idea: l.idea, blocks: l.b, hunt: l.hunt, items, src });
}
// Repaso acumulado: frases de todas las lecciones aprendidas (o de la primera si aún no hay ninguna)
function startBlockMix(src) {
  const known = blkKnown(), pool = (known.length ? known : FR_BLOCKS.slice(0, 1)).flatMap(blkItems);
  startBlockSession({ stage: "ear", title: "Repaso acumulado", items: shuffle(pool).slice(0, 10), src });
}
function blkWarmup() { const l = blkNext(); return l ? startBlockLesson(l.n, "warmup") : startBlockMix("warmup"); }

function viewBlocks() {
  const d = S.sub;
  if (d.stage === "list") return blkList();
  if (d.stage === "learn") return blkLearn(d);
  return d.i >= d.items.length ? blkDone(d) : blkPhrase(d);
}

function blkList() {
  const nx = blkNext(), known = blkKnown().length, ai = aiOff() ? " · necesita Claude" : "";
  return `<div class="back"><button class="btn quiet small" data-act="back">← Volver</button><span class="tag">${known} de ${FR_BLOCKS.length} aprendidas</span></div>
  <div class="stack"><h1>Francés por bloques</h1>
    <p class="lead">Pocas piezas por lección, ya conjugadas, que se combinan entre sí y se reciclan en cada lección siguiente. Siempre en el mismo orden: <b>escucha los bloques</b>, <b>entiende frases solo de oído</b> y después <b>dilas tú</b>.</p></div>
  <div class="plan">${FR_BLOCKS.map(l => {
    const r = blkStore()[l.n], ok = blkLearned(l.n), isNext = nx && nx.n === l.n;
    const sub = ok ? `Aprendida · entendiste ${r.ear}/10 y dijiste ${r.say}/10` : r ? `Repítela: ${r.ear}/10 de oído y ${r.say}/10 dichas (meta: ${BLK_PASS})` : l.b.slice(0, 3).map(b => b[0].split(" · ")[0]).join(" · ") + " …";
    return `<button class="step${ok ? " done" : ""}${isNext ? " next" : ""}" data-act="blk-open" data-arg="${l.n}"><span class="n">${ok ? "✓" : blkPos(l)}</span><span style="min-width:0"><b>${esc(l.title)}</b><small>${l.lv === 2 ? "Nivel 2 · " : ""}${esc(sub)}</small></span><span class="min">${isNext ? "Sigue aquí" : ""}</span></button>`;
  }).join("")}</div>
  <div class="menu">
    <button data-act="blk-mix"><span><b>Repaso acumulado</b><small>10 frases al azar de ${known ? "tus lecciones aprendidas" : "la lección 1"} · sin internet</small></span><span class="go">→</span></button>
    <button data-act="blk-ai" ${known ? "" : "disabled"}><span><b>Frases nuevas con tus bloques</b><small>${known ? `10 combinaciones nuevas con lo de ${known === 1 ? "la lección 1" : `las lecciones aprendidas (${known})`}${ai}` : "Se activa al aprender la primera lección"}</small></span><span class="go">→</span></button>
  </div>
  <button class="link" data-act="tip" data-arg="blocks" data-lang="fr">Cómo funciona el método</button>`;
}

function blkLearn(d) {
  return `<div class="back"><button class="btn quiet small" data-act="blk-list">← Lecciones</button><span class="tag">1 de 3 · Bloques</span></div>
  <h1>${esc(d.title)}</h1>
  <p class="why soft">${esc(d.idea)}</p>
  <p class="hint">Toca ▶ en cada bloque y repítelo en voz alta dos veces, imitando la voz.</p>
  <div class="card">${d.blocks.map(([fr, es, pr]) => `<div class="between" style="align-items:flex-start">
      <div style="min-width:0"><p lang="fr"><b>${esc(fr)}</b></p><p class="hint">${esc(es)}${pr ? ` · <i>${esc(pr)}</i>` : ""}</p></div>
      <button class="say" data-act="say" data-say="${esc(fr.replace(/\s*\/\s*/g, ", ").replace(/\s*·\s*/g, ", ").replace(/…/g, ""))}" data-lang="fr" aria-label="Escuchar ${esc(fr)}">▶</button></div>`).join("")}</div>
  <div class="row"><button class="btn quiet" data-act="blk-all">▶ Escuchar todos</button><button class="btn" data-act="blk-stage" data-arg="ear" style="flex:1">Ahora, frases solo de oído →</button></div>`;
}

function blkPhrase(d) {
  const it = d.items[d.i], ear = d.stage === "ear", gs = glossSet(liveCards("fr").filter(c => c.type === "word"));
  const head = `<div class="back"><button class="btn quiet small" data-act="${d.src === "warmup" ? "back" : "blk-list"}">← ${d.src === "warmup" ? "Salir" : "Lecciones"}</button><span class="tag">${ear ? "2 de 3 · Escuchar" : "3 de 3 · Decirlo tú"}</span></div>
    <div class="prog"><i style="width:${(d.i / d.items.length) * 100}%"></i></div>`;
  const reveal = `<p class="t ctx" lang="fr" style="font-family:var(--read);font-size:1.25rem">${wrapWords(md(it.fr), gs)}</p>${ear ? `<p class="es">${esc(it.es)}</p>` : ""}${it.note ? `<p class="note">${md(it.note)}</p>` : ""}`;
  const hunt = ear && d.i === 0 && d.hunt.length ? `<p class="hint">Mientras escuchas, caza estas palabras: ${d.hunt.map(h => `<b lang="fr">${esc(h)}</b>`).join(" · ")}</p>` : "";
  const rev = it.rev ? `<span class="tag" style="align-self:flex-start">Repaso · ${esc(it.rev)}</span>` : "";
  if (ear) return head + `<p class="eyebrow">Frase ${d.i + 1} de ${d.items.length}</p>${rev}${hunt}
    <p class="lead">Escucha sin leer. Intenta entenderla entera y tradúcela mentalmente al español.</p>
    <div class="row"><button class="btn" data-act="say" data-say="${esc(it.fr)}" data-lang="fr">▶ Escuchar</button><button class="btn quiet" data-act="blk-slow">▶ Más lento</button></div>
    ${d.shown ? `<div class="card">${reveal}</div>
      <div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-act="blk-ear" data-arg="0">No la entendí</button><button class="opt" data-act="blk-ear" data-arg="1">La entendí</button></div>`
      : `<button class="btn ghost wide" data-act="blk-show">Ver la frase y la traducción</button>`}`;
  return head + `<p class="eyebrow">Frase ${d.i + 1} de ${d.items.length}</p>${rev}
    <p class="lead">Dila en voz alta en francés, armándola con los bloques. Después compara.</p>
    <div class="card"><p class="t" style="font-size:1.2rem">${esc(it.es)}</p>${d.shown ? reveal : ""}</div>
    ${d.shown ? `<div class="row"><button class="btn quiet small" data-act="say" data-say="${esc(it.fr)}" data-lang="fr">▶ Escuchar</button><span class="hint">Repítela imitando la voz.</span></div>
      <div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-act="blk-say" data-arg="0">Me costó</button><button class="opt" data-act="blk-say" data-arg="1">Me salió</button></div>`
      : `<button class="btn ghost wide" data-act="blk-show">Así se dice</button>`}`;
}

function blkDone(d) {
  // Las frases de repaso no cuentan para aprobar la lección
  const own = d.items.map((_, i) => i).filter(i => !d.items[i].rev), n = own.length, nRev = d.items.length - n;
  const ear = own.filter(i => d.ear[i]).length, said = own.filter(i => d.said[i]).length;
  if (!d.logged) {
    d.logged = true;
    logTime("fr", "practice", Date.now() - d.t0);
    if (d.n) { const prev = blkStore()[d.n]; blkStore()[d.n] = { ear: Math.max(ear, prev?.ear || 0), say: Math.max(said, prev?.say || 0), date: today() }; saveProgress(); }
    if (d.src === "warmup") markDone("warm", "fr");
    if (d.fresh) saveItem({ id: uid(), kind: "cards", lang: "fr", title: d.title, items: d.items.map(x => ({ t: x.fr, es: x.es, note: x.note })), ts: Date.now(), date: today() });
  }
  const hard = d.items.filter((_, i) => !d.ear[i] || !d.said[i]), ok = d.n && blkLearned(d.n), nx = blkNext();
  return `<div class="stack"><p class="eyebrow">${esc(d.title)}</p><h1>Entendiste ${ear} de ${n} y dijiste ${said} de ${n}</h1>${nRev ? `<p class="hint">Más ${nRev} frases de repaso de lecciones anteriores, mezcladas para que no se olviden.</p>` : ""}
    <p class="lead">${!d.n ? "Repasar lo ya aprendido es lo que lo deja en automático." : ok ? "Lección aprendida. Mañana sigue con la próxima: va a reciclar todo lo de hoy." : `Para pasar a la siguiente necesitas ${BLK_PASS} de 10 en cada parte. Repítela mañana: la segunda vez sale mucho mejor.`}</p></div>
    ${hard.length ? `<div class="panel"><h3>Las que te costaron</h3>${hard.map(x => `<div class="fix"><p class="ft" lang="fr"><b>${esc(x.fr)}</b></p><p class="hint">${esc(x.es)}</p></div>`).join("")}</div>
      <button class="btn ghost wide" data-act="blk-save">Guardar ${hard.length === 1 ? "esta frase" : `estas ${hard.length} frases`} para el repaso diario</button>` : ""}
    <div class="row">${d.n ? `<button class="btn quiet" data-act="blk-open" data-arg="${d.n}">Repetir la lección</button>` : ""}
      ${d.src !== "warmup" && ok && nx ? `<button class="btn" data-act="blk-open" data-arg="${nx.n}" style="flex:1">Lección ${blkPos(nx)} →</button>` : ""}</div>
    <button class="btn ${hard.length ? "quiet" : ""} wide" data-act="${d.src === "warmup" ? "back" : "blk-list"}">${d.src === "warmup" ? "Volver a Hoy" : "Volver a las lecciones"}</button>`;
}

// Al calificar una frase se avanza y, en la parte de escuchar, la siguiente suena sola
function blkGrade(part, ok) {
  const d = S.sub; d[part][d.i] = ok; d.i++; d.shown = false; stopSay();
  if (part === "ear" && d.i >= d.items.length) { d.stage = "say"; d.i = 0; }
  render(); scrollTo(0, 0);
  if (d.stage === "ear" && d.items[d.i]) say(d.items[d.i].fr, "fr");
}
function blkStage(stage) {
  const d = S.sub; d.stage = stage; d.i = 0; d.shown = false; stopSay(); render(); scrollTo(0, 0);
  if (stage === "ear" && d.items[0]) say(d.items[0].fr, "fr");
}
function blkSaveHard(btn) {
  const d = S.sub; let k = 0;
  for (let i = 0; i < d.items.length; i++) if (!d.ear[i] || !d.said[i]) { const x = d.items[i]; if (addCard({ lang: "fr", type: "phrase", t: x.fr, es: x.es, note: x.note, src: d.title }, true)) k++; }
  toast(k ? `${k} guardadas para tu repaso diario` : "Ya estaban en tus tarjetas"); updateBadge();
  if (btn) { btn.disabled = true; btn.textContent = "Guardadas"; }
}

// Frases nuevas con IA usando solo los bloques que ya aprendiste
async function genBlocksAI() {
  const known = blkKnown(); if (!known.length) return;
  const blocks = known.flatMap(l => l.b.map(b => `${b[0]} (${b[1]})`)).join("; ");
  const data = await genJSON(`Pour un hispanophone débutant qui apprend le français avec la méthode des « blocs ». ${levelLine("fr")}
Voici TOUS les blocs qu'il connaît : ${blocks}.
Écris 10 phrases NOUVELLES, courtes et utiles au quotidien, en combinant ces blocs : verbe-clé conjugué + infinitif (je veux / je peux / je dois / je vais + verbe), pronom avant l'infinitif (je veux le voir), ne … pas autour du verbe, questions par simple intonation. Mélange les blocs de plusieurs leçons ; si les blocs incluent le passé (j'ai mangé, je suis allé…), mélange présent, futur proche et passé. N'utilise que ces blocs et des mots très fréquents ou transparents pour un hispanophone. Varie les personnes (je, tu, il, elle, on). Thèmes possibles, en version très simple : ${themeHint()}. Graine : ${uid()}.
Réponds UNIQUEMENT avec un tableau JSON de 10 objets : {"fr": phrase en français, "es": traducción natural al español de Chile, "note": EN ESPAÑOL, una frase corta: qué bloques combina y un truco}.`, "Combinando tus bloques en frases nuevas…");
  const ok = Array.isArray(data) ? data.filter(x => x && typeof x.fr === "string" && typeof x.es === "string").map(x => ({ fr: x.fr, es: x.es, note: String(x.note || "") })) : [];
  if (ok.length) startBlockSession({ stage: "ear", title: "Frases nuevas con tus bloques", items: ok, fresh: true });
  else render();
}

/* ===================== Practicar → Canciones (inglés y francés) ===================== */
// Las letras no se copian: se escuchan y se leen en Spotify o YouTube. Si un verso no se entiende,
// Claude explica solo el fragmento que pegues, sin reproducir el resto de la letra.
const SONGS = { en: SONGS_EN, fr: SONGS_FR };
const LVL_SONG = ["", "se entiende fácil", "dificultad media", "difícil de entender"];
const songList = L => SONGS[L].flatMap(g => g.songs.map(s => ({ ...s, a: g.a, L, id: L + "-" + hash(g.a + "|" + s.t) })));
const songById = id => [...songList("en"), ...songList("fr")].find(s => s.id === id);
const songStore = () => (S.progress.songs ||= {});
const songLinks = s => { const q = encodeURIComponent(`${s.a} ${s.t}`); return { sp: `https://open.spotify.com/search/${q}`, yt: `https://www.youtube.com/results?search_query=${q}` }; };
const songArtists = L => SONGS[L].map(g => g.a).join(", ");

function startSongs(L = S.lang) { stopSay(); S.sub = { kind: "songs", tab: S.tab, lang: L, id: null }; render(); scrollTo(0, 0); }
function openSong(id) { const d = S.sub; d.id = id; d.ans = null; d.q = ""; d.t0 = Date.now(); stopSay(); render(); scrollTo(0, 0); }
function viewSongs() { const d = S.sub, s = d.id && songById(d.id); return s ? songCard(d, s) : songsIndex(d); }

function songsIndex(d) {
  const L = d.lang, all = songList(L), done = songStore(), n = all.filter(s => done[s.id]).length;
  return `<div class="back"><button class="btn quiet small" data-act="back">← Volver</button><span class="tag">${n} de ${all.length} escuchadas</span></div>
  <div class="stack"><h1>Aprende con canciones</h1>
    <p class="lead">Las 5 canciones más escuchadas de cada artista: el título bien traducido, de qué trata, lo que enseña y cómo escucharla. La letra la ves en Spotify o YouTube; aquí entiendes qué dice y por qué.</p></div>
  ${SONGS[L].map(g => `<div class="stack" style="gap:8px"><h3>${esc(g.a)}</h3><div class="menu">${all.filter(s => s.a === g.a).map(s =>
    `<button data-act="song-open" data-arg="${s.id}"><span><b lang="${L}">${done[s.id] ? "✓ " : ""}${esc(s.t)}</b><small>«${esc(s.tr)}» · ${LVL_SONG[s.lvl]}</small></span><span class="go">→</span></button>`).join("")}</div></div>`).join("")}
  <button class="link" data-act="tip" data-arg="songs" data-lang="${L}">Cómo aprender con canciones</button>`;
}

const sayRow = (t, L, saveAct, i) => `<div class="row" style="flex:none;gap:6px"><button class="say" data-act="say" data-say="${esc(t)}" data-lang="${L}" aria-label="Escuchar">▶</button><button class="btn quiet small" data-act="${saveAct}" data-arg="${i}">Guardar</button></div>`;
function songCard(d, s) {
  const L = s.L, lk = songLinks(s), done = songStore()[s.id];
  return `<div class="back"><button class="btn quiet small" data-act="song-list">← Canciones</button><span class="tag">${esc(s.a)}${s.y ? " · " + s.y : ""}</span></div>
  <div class="stack" style="gap:4px"><h1 lang="${L}">${esc(s.t)}</h1><p class="hint">${esc(s.al)} · ${LVL_SONG[s.lvl]}</p></div>
  <div class="panel"><h3>Traducción inteligente del título</h3><p style="font-family:var(--read);font-size:1.25rem">«${esc(s.tr)}»</p><p>${esc(s.why)}</p></div>
  <div class="panel"><h3>De qué trata</h3><p>${esc(s.about)}</p>
    <div class="row"><a class="btn" href="${lk.sp}" target="_blank" rel="noopener">Escuchar en Spotify</a><a class="btn quiet" href="${lk.yt}" target="_blank" rel="noopener">YouTube</a></div>
    <p class="hint"><b>Cómo escucharla:</b> ${esc(s.ear)}</p></div>
  <div class="panel"><h3>Lo que te enseña</h3><p><b>${esc(s.k)}.</b> ${esc(s.x)}</p>
    ${s.ex.map(([t, es], i) => `<div class="between" style="align-items:flex-start;border-top:1px solid var(--line);padding-top:10px"><div style="min-width:0"><p lang="${L}"><b>${esc(t)}</b></p><p class="hint">${esc(es)}</p></div>${sayRow(t, L, "song-save-ex", i)}</div>`).join("")}</div>
  <div class="panel"><h3>Palabras para entenderla</h3>
    ${s.w.map(([t, es, pr], i) => `<div class="between" style="align-items:flex-start"><div style="min-width:0"><p lang="${L}"><b>${esc(t)}</b></p><p class="hint">${esc(es)}${pr ? ` · <i>${esc(pr)}</i>` : ""}</p></div>${sayRow(t, L, "song-save-w", i)}</div>`).join("")}</div>
  <div class="panel"><h3>¿Un verso que no entiendes?</h3><p class="hint">Pega solo ese verso, una o dos líneas. Claude te lo traduce y te explica las expresiones.</p>
    <textarea id="song-q" rows="2" maxlength="300" lang="${L}" placeholder="Pega aquí el verso">${esc(d.q || "")}</textarea>
    <button class="btn" data-act="song-explain">Explícamelo</button>${aiNote()}
    <div id="song-out">${d.ans ? songAns(d.ans, L) : ""}</div></div>
  <div class="panel"><h3>Cuéntala tú</h3><p lang="${L}"><b>${esc(s.say[0])}</b></p><p class="hint">${esc(s.say[1])}</p>
    <button class="btn ghost" data-act="song-tell">Responder en Hablar →</button></div>
  <button class="btn ${done ? "quiet" : ""} wide" data-act="song-done">${done ? `Escuchada el ${esc(fmtDay(new Date(done + "T12:00"), { day: "numeric", month: "long" }))} · marcar de nuevo` : "La escuché y la entendí ✓"}</button>`;
}
function songAns(a, L) {
  return `<div class="card"><p lang="${L}" style="color:var(--muted)">${esc(a.q)}</p><p style="font-family:var(--read);font-size:1.15rem"><b>${esc(a.tr)}</b></p>${a.why ? `<p>${md(a.why)}</p>` : ""}
    ${a.words.length ? `<div class="stack" style="gap:4px">${a.words.map(w => `<p><b lang="${L}">${esc(w.t)}</b> <span class="hint">· ${esc(w.es)}</span></p>`).join("")}</div>` : ""}
    ${a.pron ? `<p class="hint">Pronunciación: ${esc(a.pron)}</p>` : ""}
    <div class="row"><button class="btn quiet small" data-act="say" data-say="${esc(a.q)}" data-lang="${L}">▶ Escuchar</button><button class="btn quiet small" data-act="song-save-ans">Guardar para repasar</button></div></div>`;
}

async function explainLine() {
  const d = S.sub, s = songById(d.id), q = String($("#song-q")?.value ?? d.q ?? "").trim().slice(0, 300);
  if (!s) return;
  if (!q) return toast("Pega el verso que no entiendes");
  if (!canAI()) return;
  d.q = q; S.busy = true; S.ctl = new AbortController();
  const out = $("#song-out"); if (out) out.innerHTML = `<p class="thinking"><span class="dot"></span>Entendiendo el verso…</p>`;
  try {
    const r = await S.sample.json(`${who()} is a Spanish speaker from Chile learning ${s.L === "en" ? "English" : "French"}. ${levelLine(s.L)}
He is listening to the song "${s.t}" by ${s.a} and pasted this short excerpt he does not understand: "${q}"
Explain ONLY this excerpt. Do not quote, continue or reconstruct any other part of the song's lyrics. If the excerpt looks misheard, say so briefly without quoting the original.
Reply with ONLY JSON: {"tr": natural Spanish translation of the excerpt, "why": IN SPANISH, 2-4 short sentences on the expressions, slang, grammar or wordplay in it, "words": [{"t": word or expression from the excerpt, "es": its meaning in Spanish}] (at most 4), "pron": IN SPANISH, one pronunciation hint for the hardest part, written for a Spanish speaker}`, { signal: S.ctl.signal });
    if (!r || typeof r.tr !== "string") throw { code: "invalid_json" };
    d.ans = { q, tr: r.tr, why: String(r.why || ""), pron: String(r.pron || ""),
      words: Array.isArray(r.words) ? r.words.filter(w => w && w.t).slice(0, 4).map(w => ({ t: String(w.t), es: String(w.es || "") })) : [] };
  } catch (e) { if (e?.code !== "cancelled") toast(errMsg(e)); }
  finally { S.busy = false; }
  if (S.sub === d) { const o = $("#song-out"); if (o) o.innerHTML = d.ans ? songAns(d.ans, s.L) : ""; }
}
function songSave(el, card) {
  if (card && addCard(card)) { el.textContent = "Guardada"; el.disabled = true; updateBadge(); }
}
function songTell() {
  const s = songById(S.sub.id); if (!s) return;
  stopSay(); S.fixCtx[s.L] = `${s.say[0]} (${s.t} · ${s.a})`; S.fixRes[s.L] = null;
  S.sub = null; S.speakMode = "corregir"; S.tab = "hablar"; S.hablarT0 = Date.now(); render(); scrollTo(0, 0);
}
function songDone() {
  const d = S.sub; songStore()[d.id] = today(); saveProgress();
  if (d.t0) { logTime(d.lang, "practice", Date.now() - d.t0); d.t0 = Date.now(); }
  toast("Marcada como escuchada"); render(true);
}

/* ===================== Biblioteca: guardado · tarjetas · progreso · guía · ajustes ===================== */
function viewBiblioteca() {
  const segs = [["guardado", "Guardado"], ["tarjetas", "Tarjetas"], ["progreso", "Progreso"], ["guia", "Guía"], ["ajustes", "Ajustes"]];
  const body = { guardado: libGuardado, tarjetas: libTarjetas, progreso: libProgreso, guia: libGuia, ajustes: libAjustes }[S.libSeg] || libGuardado;
  return `<div class="chips" role="group" aria-label="Secciones de la biblioteca">${segs.map(([k, t]) => `<button class="chip" data-act="lib-seg" data-arg="${k}" aria-pressed="${S.libSeg === k}">${t}</button>`).join("")}</div>${body()}`;
}
const delRow = (id, label) => `<div class="mrow"><span style="min-width:0"><b>¿Eliminar «${esc(label)}»?</b><small>No se puede deshacer.</small></span><span class="confirm"><button class="btn quiet small" data-act="del-no">No</button><button class="btn bad small" data-act="del-yes" data-arg="${esc(id)}">Eliminar</button></span></div>`;

function libGuardado() {
  const L = S.lang, list = S.items.filter(x => x.lang === L), K = { reading: "Lectura", drill: "Ejercicios", cards: "Frases" };
  const nRead = list.filter(x => x.kind === "reading").length;
  const row = x => S.delAsk === x.id ? delRow(x.id, x.title) : `<div class="mrow">
    <button data-act="open-item" data-arg="${esc(x.id)}" style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left">
      <span style="min-width:0"><b>${esc(x.title)}</b><small>${K[x.kind] || ""}${x.min ? " · " + x.min + " min" : ""}${x.kind === "reading" ? (x.reads ? ` · leída ${x.reads} ${x.reads === 1 ? "vez" : "veces"}` : " · sin leer") : ""} · ${esc(x.date || "")}</small></span><span class="go">→</span></button>
    <button class="del" data-act="del-ask" data-arg="${esc(x.id)}" aria-label="Eliminar ${esc(x.title)}">×</button></div>`;
  return `<div class="stack"><h1>Tu material guardado</h1><p class="lead">Todo lo que terminas queda aquí${S.db ? " y se sincroniza entre tu teléfono y tu tablet" : ""}. Releer es de lo más efectivo que puedes hacer.</p></div>
  ${list.length ? `<div class="menu">${list.map(row).join("")}</div>` : `<p class="empty">Aún no hay nada guardado en ${LANG_NAME[L]}.<br>Termina una lectura o una práctica y aparecerá aquí.</p>`}
  <div class="panel"><h3>Para leer sin conexión</h3>
    <p class="hint">Con la app abierta, tus textos guardados funcionan sin internet. Para un viaje largo, descarga un archivo con todas tus lecturas en ${LANG_NAME[L]}: se abre en el teléfono aunque no tengas señal, con el español de cada párrafo, el vocabulario y «Así se dice».</p>
    ${S.downloads ? `<button class="btn ghost wide" data-act="dl-offline" ${nRead ? "" : "disabled"}>Descargar lecturas en ${LANG_NAME[L]} (${nRead})</button>` : `<p class="hint">La descarga funciona al abrir la app dentro de Claude.</p>`}</div>`;
}

function cardRows(L) {
  const q = stripAcc((S.cardQ || "").toLowerCase()), now = Date.now();
  const list = liveCards(L).filter(c => !q || stripAcc(`${c.t} ${c.es} ${c.bad}`.toLowerCase()).includes(q)).sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 120);
  if (!list.length) return `<p class="empty">${S.cardQ ? "Sin resultados" : "Aún no tienes tarjetas en " + LANG_NAME[L]}</p>`;
  return `<div class="menu">${list.map(c => {
    const id = "card:" + c.id, when = isNewCard(c) ? "nueva" : c.due <= now ? "para hoy" : "vuelve en " + ivlLabel((c.due - now) / DAY);
    const kind = { word: "palabra", phrase: "frase", fix: "corrección" }[c.type];
    return S.delAsk === id ? delRow(id, c.t) : `<div class="mrow"><span style="min-width:0"><b lang="${L}">${esc(c.t)}</b><small>${esc(c.type === "fix" ? "en vez de: " + c.bad : c.es)} · ${kind} · ${when}</small></span><button class="del" data-act="del-ask" data-arg="${esc(id)}" aria-label="Eliminar tarjeta">×</button></div>`;
  }).join("")}</div>`;
}
function libTarjetas() {
  const L = S.lang, st = cardStats(L), due = dueCount(L);
  return `<div class="stack"><h1>Tus tarjetas de repaso</h1><p class="lead">Palabras, frases y correcciones que guardaste. Vuelven en tu repaso justo antes de que las olvides: así pasan a la memoria de largo plazo.</p></div>
  <div class="stats"><div class="stat"><b>${st.nuevas}</b><span>nuevas</span></div><div class="stat"><b>${st.aprendiendo}</b><span>aprendiendo</span></div><div class="stat"><b>${st.dominadas}</b><span>dominadas (3+ semanas)</span></div></div>
  <button class="btn wide" data-act="review" ${due ? "" : "disabled"}>${due ? `Repasar ahora (${due})` : "Sin tarjetas pendientes hoy"}</button>
  ${st.total ? `<input type="search" id="card-q" placeholder="Buscar en tus tarjetas" value="${esc(S.cardQ || "")}">` : ""}
  <div id="card-list">${cardRows(L)}</div>
  <p class="hint">Para agregar: toca una palabra en cualquier texto y elige «Guardar para repasar», o guarda frases de «Así se dice», de «Quiero decir» y de tus correcciones.</p>`;
}

function libProgreso() {
  const L = S.lang, st = S.progress.stats[L] || {}, k = st.kinds || {}, all = (S.progress.stats.en?.min || 0) + (S.progress.stats.fr?.min || 0);
  const w = S.progress.wpm[L] || [], wpm = w.length ? Math.round(w.slice(-5).reduce((a, x) => a + x.wpm, 0) / Math.min(5, w.length)) : 0;
  const keys = L === "en" ? Object.keys(CATS) : Object.keys(FR_CATS);
  const meters = weakOrder(keys, L).map(x => `<div class="meter"><span>${esc(L === "en" ? CATS[x.k] : FR_CATS[x.k])}</span><div class="prog"><i style="width:${x.n ? Math.round(x.acc * 100) : 0}%"></i></div><span>${x.n ? Math.round(x.acc * 100) + "%" : "—"}</span></div>`).join("");
  const errs = Object.entries(S.progress.errors[L] || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const cs = cardStats(L);
  return `<div class="stack"><h1>Tu progreso</h1><p class="lead">Constancia, precisión y fluidez en ${LANG_NAME[L]}.</p></div>
  <div class="stats">
    <div class="stat"><b>${streak()}</b><span>días seguidos</span></div>
    <div class="stat"><b>${fmtMin(all)}</b><span>minutos en total</span></div>
    <div class="stat"><b>${wpm || "—"}</b><span>palabras por minuto leyendo</span></div>
  </div>
  <div class="panel"><div class="between"><h3>Últimos 14 días</h3>${chartLegend()}</div>${weekChart(14)}</div>
  <div class="panel"><h3>Precisión por ${L === "en" ? "estructura" : "tiempo verbal"}</h3>${meters}</div>
  <div class="panel"><h3>Errores frecuentes al hablar</h3>${errs.length ? errs.map(([c, n]) => `<div class="between"><span>${esc(errLabel(L, c))}</span><span class="row" style="gap:8px"><span class="hint">${n}×</span>${tipFor(L, c) ? `<button class="link" data-act="tip" data-arg="${esc(c)}">Ver la regla</button>` : ""}</span></div>`).join("") : `<p class="hint">Aún no hay datos. Usa «Corrígeme» o «Habla 1 minuto» y aquí verás qué errores se repiten.</p>`}</div>
  <div class="panel"><h3>Actividad en ${LANG_NAME[L]}</h3>
    <div class="between"><span>Lecturas terminadas</span><b>${st.readings || 0}</b></div>
    <div class="between"><span>Sesiones de repaso</span><b>${k.review || 0}</b></div>
    <div class="between"><span>Ejercicios</span><b>${k.practice || 0}</b></div>
    <div class="between"><span>Prácticas de habla</span><b>${k.speak || 0}</b></div>
    <div class="between"><span>Tarjetas (nuevas · aprendiendo · dominadas)</span><b>${cs.nuevas} · ${cs.aprendiendo} · ${cs.dominadas}</b></div></div>`;
}

const tipSay = e => e.replace(/\(.*?\)|‿/g, "").replace(/·.*$/, "").replace(/→.*$/, "");
function tipHtml([t, body, exs], lang) {
  return `<details class="tipx"><summary>${esc(t)}</summary><div class="body"><p>${esc(body)}</p>
    ${exs.map(e => `<p class="ex rp" style="font-size:1.05rem"><span lang="${lang}">${md(e)}</span><button class="say" data-act="say" data-say="${esc(tipSay(e))}" data-lang="${lang}" aria-label="Escuchar">▶</button></p>`).join("")}</div></details>`;
}
function libGuia() {
  const L = S.lang;
  return `<div class="stack"><h1>${L === "en" ? "Entiende el porqué" : "Las reglas que más rinden"}</h1><p class="lead">Explicaciones cortas para leer antes o después de practicar. Toca ▶ en los ejemplos para oírlos.</p></div>
  ${Object.entries(TIPS[L]).map(([sec, tips]) => `<div class="stack"><h3>${esc(sec)}</h3>${tips.map(t => tipHtml(t, L)).join("")}</div>`).join("")}
  <div class="panel"><h3>Pregúntale a tu tutor</h3>
    <textarea id="ask" lang="es" placeholder="${L === "en" ? "Ej: ¿Cuál es la diferencia entre «I have been working» e «I have worked»?" : "Ej: ¿Cuándo uso être y cuándo avoir en el passé composé?"}">${esc(S.askQ || "")}</textarea>
    <button class="btn" data-act="ask-tutor" ${aiOff() ? "disabled" : ""}>Preguntar</button>${aiNote()}
    <div class="answer" id="answer">${md(S.askA || "")}</div></div>`;
}
function showTip(lang, cat) {
  const tip = tipFor(lang, cat); if (!tip) return;
  S.sheet = { tip: true, lang };
  $("#sheet-in").innerHTML = `<div class="sheet-head"><div class="term" style="font-size:1.15rem">${esc(tip[0])}</div><button class="x" data-act="sheet-close" aria-label="Cerrar">×</button></div>
    <p>${esc(tip[1])}</p>${tip[2].map(e => `<p class="ex rp"><span lang="${lang}">${md(e)}</span><button class="say" data-act="say" data-say="${esc(tipSay(e))}" data-lang="${lang}" aria-label="Escuchar">▶</button></p>`).join("")}`;
  $("#sheet").hidden = false;
}
async function askTutor() {
  const q = ($("#ask")?.value || "").trim();
  if (!q) return toast("Escribe tu pregunta");
  if (!canAI()) return;
  S.busy = true; S.askQ = q;
  const out = $("#answer"), btn = $('[data-act="ask-tutor"]'); if (btn) btn.disabled = true;
  out.textContent = "Pensando…";
  try {
    const r = await S.sample(`Eres un profesor experto de ${S.lang === "en" ? `inglés. El alumno es hispanohablante. ${levelLine("en")}` : `francés. El alumno es hispanohablante. ${levelLine("fr")}`} Responde EN ESPAÑOL, breve y claro (máximo 150 palabras): la regla en una frase, 3 ejemplos con traducción, un truco para recordarla y una nota de pronunciación si aplica. Sin títulos. Pregunta: ${q}`,
      { onText: ({ text }) => { if (out.isConnected) out.innerHTML = md(text); } });
    S.askA = r.text;
  } catch (e) { out.textContent = errMsg(e); }
  S.busy = false; if (btn) btn.disabled = false;
}

function libAjustes() {
  const goal = S.progress.goal || 15, npd = S.progress.newPerDay || 15;
  const vsel = L => { const vs = TTS.list(L), cur = TTS.voice(L);
    return vs.length ? `<select id="voice-${L}" data-lang="${L}" aria-label="Voz en ${LANG_NAME[L]}">${vs.slice().sort((a, b) => TTS.score(b, L) - TTS.score(a, L)).map(v => `<option value="${esc(v.voiceURI)}" ${cur && v.voiceURI === cur.voiceURI ? "selected" : ""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select>`
      : `<p class="hint">No encontré voces en ${LANG_NAME[L]} en este dispositivo.</p>`; };
  return `<div class="stack"><h1>Ajustes</h1><p class="lead">Se guardan para tus dos dispositivos, salvo la voz, que depende de cada uno.</p></div>
  <div class="panel">
    <div class="setrow"><h3>Meta diaria</h3><div class="chips">${[10, 15, 20, 30].map(n => `<button class="chip" data-act="goal" data-arg="${n}" aria-pressed="${goal === n}">${n} min</button>`).join("")}</div><p class="hint">Minutos por día sumando los dos idiomas. Mejor poco todos los días que mucho una vez a la semana.</p></div>
    <div class="setrow"><h3>Tarjetas nuevas por día</h3><div class="chips">${[5, 10, 15, 20, 30].map(n => `<button class="chip" data-act="newpd" data-arg="${n}" aria-pressed="${npd === n}">${n}</button>`).join("")}</div><p class="hint">Más tarjetas nuevas significa más repasos los días siguientes.</p></div>
    ${["en", "fr"].map(L => `<div class="setrow"><h3>Voz en ${LANG_NAME[L]}</h3>${vsel(L)}
      <label class="hint" for="rate-${L}">Velocidad: <b id="rate-v-${L}">${TTS.rate(L).toFixed(2)}×</b></label>
      <input type="range" id="rate-${L}" data-lang="${L}" min="0.6" max="1.2" step="0.05" value="${TTS.rate(L)}">
      <div><button class="btn quiet small" data-act="test-voice" data-arg="${L}">▶ Probar</button></div></div>`).join("")}
    <div class="setrow"><h3>Para que la voz suene más natural</h3><p class="hint">iPhone: Ajustes → Accesibilidad → Contenido leído → Voces. Descarga una voz «mejorada» en inglés y otra en francés (por ejemplo Samantha y Amélie) y elígelas aquí. Android: Ajustes → Texto a voz → instala los datos de voz de inglés y francés.</p></div>
    ${window.vpAccount ? vpAccount.row() : ""}
  </div>`;
}

/* ---------- Abrir algo guardado ---------- */
function openItem(id) {
  const x = S.items.find(i => i.id === id); if (!x) return;
  stopSay();
  if (x.kind === "reading") { S.reading = { ...x, saved: true, showTr: false, open: {}, tr: x.tr || {}, quiz: {}, startedAt: Date.now() }; S.lang = x.lang; LS.set("lang", x.lang); S.tab = "leer"; render(); }
  else if (x.kind === "drill") { S.tab = "practicar"; startDrill(x.items, { title: x.title.replace(/ · \d+\/\d+$/, ""), lang: x.lang }); }
  else { S.tab = "practicar"; startCards(x.items, x.title, x.lang, false); }
  scrollTo(0, 0);
}

async function downloadOffline() {
  const lang = S.lang;
  if (!S.items.some(x => x.kind === "reading" && x.lang === lang)) return toast("Aún no hay lecturas guardadas en este idioma");
  try {
    await S.downloads.save({ filename: `voz-propia-lecturas-${lang === "en" ? "ingles" : "frances"}-${today()}.html`, data: buildOfflineHtml(lang) });
    toast("Archivo listo para leer sin conexión");
  } catch (e) {
    if (e?.code === "declined") return;
    toast(e?.code === "rate_limited" ? "Ya hay una descarga pendiente. Revisa la ventana abierta." : "No se pudo descargar el archivo aquí.");
  }
}

  else if (t.id === "want") S.wantQ[S.lang] = t.value;
  else if (t.id === "fix-in") S.fixQ[S.lang] = t.value;
  else if (t.id === "ask") S.askQ = t.value;
  else if (t.id === "song-q" && S.sub?.kind === "songs") S.sub.q = t.value;
  else if (t.id?.startsWith("rate-")) { const L = t.dataset.lang; S.progress.rate[L] = +t.value; const v = $("#rate-v-" + L); if (v) v.textContent = (+t.value).toFixed(2) + "×"; saveProgress(); }
});
document.addEventListener("change", e => { const t = e.target; if (t.id?.startsWith("voice-")) { LS.set("voice:" + t.dataset.lang, t.value); toast("Voz guardada en este dispositivo"); } });
document.addEventListener("pointerover", e => { const h = e.target.closest?.(".hit"); if (h) chartTip(h, true); });
document.addEventListener("pointerout", e => { const h = e.target.closest?.(".hit"); if (h) chartTip(h, false); });
document.addEventListener("focusin", e => { if (e.target.classList?.contains("hit")) chartTip(e.target, true); });
document.addEventListener("focusout", e => { if (e.target.classList?.contains("hit")) chartTip(e.target, false); });

async function boot() {
  TTS.init();
  applyThemeSeeds(LS.get("themes", null));
  render();
  if (!window.claude?.use) { S.ready = true; render(); return; }
  const get = n => Promise.resolve(claude.use(n)).catch(() => null);
  const [db, sample, downloads] = await Promise.all([get("db"), get("sample"), get("downloads")]);
  S.db = db; S.sample = sample; S.downloads = downloads; S.ready = true;
  if (db) { try { await syncFromDb(db); } catch (e) { console.warn(e); } }
  lastSync = Date.now();
  rerender();
}
function rerender() {
  const a = document.activeElement;
  if (S.busy || (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) updateBadge(); else render(true);
}
// Al volver a la app (o recuperar internet) trae lo hecho en el otro dispositivo, sin interrumpir una lectura o práctica
let lastSync = 0;
async function resync() {
  if (!S.db || S.busy || S.reading || S.sub || document.hidden || Date.now() - lastSync < 60000) return;
  lastSync = Date.now();
  try { await syncFromDb(S.db); } catch (e) { console.warn(e); return; }
  if (!S.reading && !S.sub) rerender();
}
addEventListener("online", resync);
document.addEventListener("visibilitychange", resync);
boot();
</script>
<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e)));</script>
</body>
